<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCM 2.0 - Campus Community MarketPlace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="../css/theme-animations.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200">

  <!-- NAVBAR - OVERFLOW FIX PANNITEN -->
  <nav class="bmw-navbar bg-white dark:bg-gray-800 shadow-md p-4 sticky top-0 z-50 relative transition-colors animate-fade-down" style="overflow: visible !important;">
    <div class="max-w-6xl mx-auto flex justify-between items-center" style="overflow: visible !important;">
      <h1 class="text-2xl font-bold text-blue-600 dark:text-blue-400 bmw-hover px-3 py-1 rounded-lg">CCM 2.0</h1>

      <div id="auth-section" class="flex gap-4 items-center flex-wrap" style="overflow: visible !important;">
        <span class="text-gray-500 dark:text-gray-400">Loading...</span>
      </div>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto p-4 page-transition">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
      <input type="text" id="search-input" placeholder="Search books, cycles..."
             class="w-full p-3 border dark:border-gray-600 rounded-lg md:col-span-2 bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 transition-all">
      <input type="number" id="min-price" placeholder="Min ₹"
             class="w-full p-3 border dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 transition-all">
      <input type="number" id="max-price" placeholder="Max ₹"
             class="w-full p-3 border dark:border-gray-600 rounded-lg bg-white dark:bg-gray-800 text-gray-900 dark:text-white focus:ring-2 focus:ring-blue-500 transition-all">
    </div>

    <div class="flex gap-2 mt-3 overflow-x-auto items-center" id="category-filters">
      <button id="search-btn" class="transformer-btn bmw-hover bg-blue-600 text-white px-6 py-2 rounded-lg whitespace-nowrap hover:bg-blue-700">
        Search
      </button>
      <button data-category="All" class="px-4 py-1 bg-blue-600 text-white rounded-full text-sm bmw-hover">All</button>
      <button data-category="Books" class="px-4 py-1 bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 rounded-full text-sm hover:bg-gray-300 dark:hover:bg-gray-600 bmw-hover">Books</button>
      <button data-category="Cycles" class="px-4 py-1 bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 rounded-full text-sm hover:bg-gray-300 dark:hover:bg-gray-600 bmw-hover">Cycles</button>
      <button data-category="Electronics" class="px-4 py-1 bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 rounded-full text-sm hover:bg-gray-300 dark:hover:bg-gray-600 bmw-hover">Electronics</button>
      <button data-category="Hostel Items" class="px-4 py-1 bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 rounded-full text-sm hover:bg-gray-300 dark:hover:bg-gray-600 bmw-hover">Hostel</button>
      <button id="near-me-btn" class="px-4 py-1 bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200 rounded-full text-sm whitespace-nowrap hover:bg-gray-300 dark:hover:bg-gray-600 bmw-hover">📍 Near Me 5km</button>
    </div>
  </div>

  <div id="product-feed" class="max-w-6xl mx-auto p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    <div class="col-span-full text-center text-gray-400 dark:text-gray-500 py-10 animate-pulse">Loading products...</div>
  </div>

  <!-- Global Theme Button - INLINE -->
  <script>
    const html = document.documentElement
    const THEME_KEY = 'ccm-theme'

    function applyTheme() {
      const saved = localStorage.getItem(THEME_KEY)
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        html.classList.add('dark')
      } else {
        html.classList.remove('dark')
      }
    }

    function toggleTheme() {
      html.classList.toggle('dark')
      const isDark = html.classList.contains('dark')
      localStorage.setItem(THEME_KEY, isDark? 'dark' : 'light')
      window.dispatchEvent(new CustomEvent('themeChanged', { detail: { isDark } }))
      return isDark? '☀️' : '🌙'
    }

    function getThemeIcon() {
      return html.classList.contains('dark')? '☀️' : '🌙'
    }

    applyTheme()

    const btn = document.createElement('button')
    btn.id = 'global-theme-toggle'
    btn.className = 'fixed bottom-6 right-6 z-50 text-2xl p-4 rounded-full bg-white dark:bg-gray-800 shadow-2xl hover:scale-110 active:scale-95 transition-all border-2 border-gray-200 dark:border-gray-700 transformer-btn'
    btn.textContent = getThemeIcon()
    btn.title = 'Toggle Theme'
    btn.onclick = () => {
      btn.textContent = toggleTheme()
    }

    window.addEventListener('themeChanged', (e) => {
      btn.textContent = e.detail.isDark? '☀️' : '🌙'
    })

    document.body.appendChild(btn)
  </script>

  <!-- NAVBAR + NOTIFICATION SCRIPT - FINAL -->
  <script type="module">
    import { supabase } from './js/supabase.js'

    const authSection = document.getElementById('auth-section')
    let currentUserId = null
    let notificationChannel = null

    // ORDER FUNCTION
    window.placeOrder = async (productId, sellerId, price, productName) => {
      const { data: { session } } = await supabase.auth.getSession()
      const user = session?.user

      if (!user) {
        alert('please login for order a project')
        window.location.href = 'pages/login.html'
        return
      }

      if (user.id === sellerId) {
        alert('dont order yourself😂')
        return
      }

      const confirmOrder = confirm(`"${productName}" - ₹${price} ku order pannava?`)
      if (!confirmOrder) return

      const { error: orderError } = await supabase.from('orders').insert({
        buyer_id: user.id,
        seller_id: sellerId,
        product_id: productId,
        quantity: 1,
        total_price: price,
        status: 'pending'
      })

      if (orderError) {
        alert('Order failed: ' + orderError.message)
        return
      }

      await supabase.from('notifications').insert({
        user_id: sellerId,
        message: `${user.email || 'Someone'} ordered your product: "${productName}" for ₹${price}`,
        is_read: false,
        type: 'order'
      })

      alert('Order place aagiduchu! ✅')
      window.location.href = 'pages/orders.html'
    }

    // LOAD NOTIFICATIONS
    async function loadNotifications(userId) {
      const notifList = document.getElementById('notification-list')
      const notifBadge = document.getElementById('notification-badge')

      if (!notifList ||!notifBadge) return

      const { data: notifs } = await supabase
       .from('notifications')
       .select('*')
       .eq('user_id', userId)
       .order('created_at', { ascending: false })
       .limit(10)

      const unreadCount = notifs?.filter(n =>!n.is_read).length || 0

      if (unreadCount > 0) {
        notifBadge.textContent = unreadCount
        notifBadge.classList.remove('hidden')
      } else {
        notifBadge.classList.add('hidden')
      }

      if (!notifs || notifs.length === 0) {
        notifList.innerHTML = '<div class="p-4 text-gray-500 dark:text-gray-400 text-center">No notifications</div>'
        return
      }

      notifList.innerHTML = notifs.map(n => `
        <div class="p-3 hover:bg-gray-50 dark:hover:bg-gray-700 border-b dark:border-gray-700 cursor-pointer ${!n.is_read? 'bg-blue-50 dark:bg-blue-900/30' : ''}"
             onclick="markNotificationRead('${n.id}')">
          <p class="text-sm text-gray-800 dark:text-gray-200">${n.message}</p>
          <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">${new Date(n.created_at).toLocaleString('en-IN')}</p>
        </div>
      `).join('')
    }

    window.markNotificationRead = async (notifId) => {
      if (!currentUserId) return
      await supabase.from('notifications').update({ is_read: true }).eq('id', notifId)
      loadNotifications(currentUserId)
    }

    function renderNavbar(user) {
      if (user) {
        currentUserId = user.id
        authSection.innerHTML = `
          <div class="notification-container relative" style="z-index: 999999 !important;">
            <button id="notification-bell" type="button" class="relative text-2xl hover:scale-110 transition-transform bmw-hover cursor-pointer">
              🔔
              <span id="notification-badge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
            </button>

            <div id="notification-dropdown" class="hidden absolute right-0 top-12 w-80 bg-white dark:bg-gray-800 rounded-lg shadow-2xl border dark:border-gray-700" style="z-index: 999999!important;">
              <div class="p-4 border-b dark:border-gray-700 font-bold text-gray-800 dark:text-white flex justify-between items-center">
                <span>Notifications</span>
                <button id="mark-all-read" type="button" class="text-xs text-blue-600 dark:text-blue-400 hover:text-blue-800">Mark all read</button>
              </div>
              <div id="notification-list" class="max-h-96 overflow-y-auto">
                <div class="p-4 text-gray-500 dark:text-gray-400 text-center">Loading...</div>
              </div>
            </div>
          </div>

          <a href="pages/wishlist.html" class="flex items-center gap-1 text-gray-600 dark:text-gray-300 hover:text-red-500 bmw-hover">
            <span>❤️</span><span class="hidden md:inline">Wishlist</span>
          </a>
          <a href="pages/orders.html" class="text-gray-600 dark:text-gray-300 hover:text-blue-600 bmw-hover">My Orders</a>
          <a href="pages/chats.html" class="text-gray-600 dark:text-gray-300 hover:text-blue-600 bmw-hover">My Chats</a>
          <a href="pages/profile.html" class="text-gray-600 dark:text-gray-300 hover:text-blue-600 bmw-hover">Profile</a>
          <button id="logout-btn" type="button" class="text-red-600 hover:text-red-700 bmw-hover">Logout</button>
          <a href="pages/add-product.html" class="transformer-btn bmw-hover bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">+ Sell</a>
        `

        document.getElementById('logout-btn').onclick = async () => {
          await supabase.auth.signOut()
        }

        document.getElementById('mark-all-read').onclick = async (e) => {
          e.stopPropagation()
          await supabase.from('notifications')
           .update({ is_read: true })
           .eq('user_id', user.id)
           .eq('is_read', false)
          loadNotifications(user.id)
        }

        // BELL CLICK
        setTimeout(() => {
          const bell = document.getElementById('notification-bell')
          const dropdown = document.getElementById('notification-dropdown')

          if (bell && dropdown) {
            bell.onclick = function(e) {
              e.preventDefault()
              e.stopPropagation()
              dropdown.classList.toggle('hidden')
              if (!dropdown.classList.contains('hidden')) {
                loadNotifications(user.id)
              }
            }
          }
        }, 100)

        // REALTIME
        if (notificationChannel) {
          supabase.removeChannel(notificationChannel)
        }

        notificationChannel = supabase
         .channel('user-notifications')
         .on('postgres_changes', {
            event: 'INSERT',
            schema: 'public',
            table: 'notifications',
            filter: `user_id=eq.${user.id}`
          }, () => {
            loadNotifications(user.id)
          })
         .subscribe()

        loadNotifications(user.id)

      } else {
        currentUserId = null
        authSection.innerHTML = `
          <a href="pages/login.html" class="text-gray-700 dark:text-gray-300 hover:text-blue-600 bmw-hover">Login</a>
          <a href="pages/add-product.html" class="transformer-btn bmw-hover bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">+ Sell</a>
        `
      }
    }

    // CLICK OUTSIDE TO CLOSE
    document.addEventListener('click', (e) => {
      const dropdown = document.getElementById('notification-dropdown')
      const bell = document.getElementById('notification-bell')

      if (dropdown && bell &&!bell.contains(e.target) &&!dropdown.contains(e.target)) {
        dropdown.classList.add('hidden')
      }
    })

    // AUTH STATE CHANGE
    supabase.auth.onAuthStateChange((event, session) => {
      renderNavbar(session?.user)
    })

    // INIT
    const { data: { session } } = await supabase.auth.getSession()
    renderNavbar(session?.user)
  </script>

  <script type="module" src="js/main.js"></script>
  <!-- Theme Effects JS -->
  <script type="module" src="../js/theme-effects.js"></script>
</body>
</html>
