<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Campus Community Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
  <nav id="main-navbar"></nav>

  <div class="max-w-xl mx-auto px-4 py-8">
    <div class="bg-white dark:bg-gray-800 p-6 sm:p-8 rounded-2xl shadow-md border border-gray-200 dark:border-gray-700">
      
      <div class="text-center mb-6">
        <h2 class="text-2xl font-black text-blue-600 dark:text-blue-400">Join CCM 2.0</h2>
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
          Create your account for College or Community Marketplace
        </p>
      </div>

      <!-- Registration Type Tabs -->
      <div class="flex border-b border-gray-200 dark:border-gray-700 mb-6 font-bold text-xs">
        <button id="tab-student" class="flex-1 py-3 text-center border-b-2 border-blue-600 text-blue-600 dark:text-blue-400">
          🎓 Student
        </button>
        <button id="tab-staff" class="flex-1 py-3 text-center border-b-2 border-transparent text-gray-500 hover:text-blue-600">
          👨‍🏫 Staff
        </button>
        <button id="tab-community" class="flex-1 py-3 text-center border-b-2 border-transparent text-gray-500 hover:text-blue-600">
          🌐 Community User
        </button>
      </div>

      <form id="register-form" class="space-y-4">
        <input type="hidden" id="user-type" value="student">

        <!-- Common Fields -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold mb-1">Full Name *</label>
            <input type="text" id="full-name" required placeholder="e.g. Akash Raj"
                   class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">Username *</label>
            <input type="text" id="username" required placeholder="e.g. akash_cit"
                   class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold mb-1">Email Address *</label>
            <input type="email" id="email" required placeholder="name@college.edu or gmail"
                   class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">Mobile Number *</label>
            <input type="tel" id="mobile" required placeholder="e.g. 9876543210"
                   class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <!-- College Specific Fields -->
        <div id="college-fields-container" class="space-y-3 pt-2 border-t border-gray-100 dark:border-gray-700">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold mb-1" id="label-college-id">College Roll / ID No. *</label>
              <input type="text" id="college-id" placeholder="e.g. 21IT045"
                     class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">College Name *</label>
              <input type="text" id="college-name" placeholder="e.g. CIT Coimbatore"
                     class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold mb-1">Department *</label>
              <input type="text" id="department" placeholder="e.g. Information Technology"
                     class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
            </div>
            <div id="course-field-wrap">
              <label class="block text-xs font-bold mb-1">Course *</label>
              <input type="text" id="course" placeholder="e.g. B.Tech IT"
                     class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
            </div>
          </div>

          <div id="student-academic-wrap" class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold mb-1">Year</label>
              <select id="year" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year" selected>3rd Year</option>
                <option value="4th Year">4th Year</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold mb-1">Semester</label>
              <select id="semester" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
                <option value="Sem 1">Sem 1</option>
                <option value="Sem 2">Sem 2</option>
                <option value="Sem 3">Sem 3</option>
                <option value="Sem 4">Sem 4</option>
                <option value="Sem 5">Sem 5</option>
                <option value="Sem 6" selected>Sem 6</option>
                <option value="Sem 7">Sem 7</option>
                <option value="Sem 8">Sem 8</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Location & Address -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t border-gray-100 dark:border-gray-700">
          <div>
            <label class="block text-xs font-bold mb-1">City / Location *</label>
            <input type="text" id="location" required placeholder="e.g. Coimbatore"
                   class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">Hostel / Campus Address</label>
            <input type="text" id="address" placeholder="e.g. Kaveri Hostel Room 204"
                   class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <!-- Password -->
        <div class="pt-2 border-t border-gray-100 dark:border-gray-700">
          <label class="block text-xs font-bold mb-1">Password (min 6 characters) *</label>
          <input type="password" id="password" required minlength="6" placeholder="••••••••"
                 class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Error & Info Message -->
        <div id="error-msg" class="text-xs text-red-500 font-semibold text-center hidden"></div>

        <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-md">
          Create Account
        </button>
      </form>

      <div class="mt-6 text-center text-xs text-gray-500 dark:text-gray-400">
        Already have an account? 
        <a href="login.html" class="text-blue-600 dark:text-blue-400 font-bold hover:underline">Login here</a>
      </div>

    </div>
  </div>

  <script type="module" src="../js/theme.js"></script>
  <script type="module" src="../js/i18n.js"></script>
  <script type="module" src="../js/mode.js"></script>
  <script type="module" src="../js/navbar.js"></script>
  <script type="module">
    import { supabase } from '../js/supabase.js'

    const userTypeInput = document.getElementById('user-type')
    const collegeContainer = document.getElementById('college-fields-container')
    const studentAcademicWrap = document.getElementById('student-academic-wrap')
    const courseWrap = document.getElementById('course-field-wrap')
    const labelCollegeId = document.getElementById('label-college-id')
    const errorMsg = document.getElementById('error-msg')
    const submitBtn = document.getElementById('submit-btn')

    const tabStudent = document.getElementById('tab-student')
    const tabStaff = document.getElementById('tab-staff')
    const tabCommunity = document.getElementById('tab-community')

    function setTab(type) {
      userTypeInput.value = type
      const activeClass = 'flex-1 py-3 text-center border-b-2 border-blue-600 text-blue-600 dark:text-blue-400'
      const inactiveClass = 'flex-1 py-3 text-center border-b-2 border-transparent text-gray-500 hover:text-blue-600'
      tabStudent.className = type === 'student' ? activeClass : inactiveClass
      tabStaff.className = type === 'staff' ? activeClass : inactiveClass
      tabCommunity.className = type === 'community_user' ? activeClass : inactiveClass

      if (type === 'student') {
        collegeContainer.style.display = 'block'
        studentAcademicWrap.style.display = 'grid'
        courseWrap.style.display = 'block'
        labelCollegeId.textContent = 'College Roll / ID No. *'
      } else if (type === 'staff') {
        collegeContainer.style.display = 'block'
        studentAcademicWrap.style.display = 'none'
        courseWrap.style.display = 'none'
        labelCollegeId.textContent = 'Staff / Faculty ID No. *'
      } else {
        collegeContainer.style.display = 'none'
      }
    }

    tabStudent.onclick = () => setTab('student')
    tabStaff.onclick = () => setTab('staff')
    tabCommunity.onclick = () => setTab('community_user')

    // Parse URL param if direct link (e.g. ?type=staff)
    const urlParams = new URLSearchParams(window.location.search)
    const typeParam = urlParams.get('type')
    if (typeParam === 'staff') setTab('staff')
    else if (typeParam === 'community') setTab('community_user')

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      errorMsg.classList.add('hidden')
      submitBtn.disabled = true
      submitBtn.textContent = 'Creating Account...'

      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value
      const fullName = document.getElementById('full-name').value.trim()
      const username = document.getElementById('username').value.trim()
      const mobile = document.getElementById('mobile').value.trim()
      const userType = userTypeInput.value
      const location = document.getElementById('location').value.trim()
      const address = document.getElementById('address').value.trim()
      const collegeId = document.getElementById('college-id')?.value.trim() || ''
      const collegeName = document.getElementById('college-name')?.value.trim() || ''
      const department = document.getElementById('department')?.value.trim() || ''
      const course = document.getElementById('course')?.value.trim() || ''
      const year = document.getElementById('year')?.value || ''
      const semester = document.getElementById('semester')?.value || ''

      try {
        // 1. Supabase Auth Sign Up
        const { data, error: authError } = await supabase.auth.signUp({
          email: email,
          password: password,
          options: {
            data: { full_name: fullName, username: username, user_type: userType }
          }
        })

        if (authError) throw authError

        const userId = data.user?.id
        if (userId) {
          // 2. Save complete Profile Details
          const profileData = {
            id: userId,
            name: fullName,
            full_name: fullName,
            username: username,
            email: email,
            phone: mobile,
            mobile_number: mobile,
            user_type: userType,
            college_id_number: collegeId,
            college_name: collegeName || 'Campus College',
            department: department,
            course: course,
            year: year,
            semester: semester,
            location: location,
            address: address,
            is_verified: userType !== 'community_user',
            role: 'user'
          }

          const { error: profError } = await supabase.from('profiles').upsert(profileData)
          if (profError) {
            console.warn('Profile save note:', profError.message)
            // Cache locally so experience is uninterrupted
            localStorage.setItem(`ccm_profile_${userId}`, JSON.stringify(profileData))
          }
        }

        submitBtn.textContent = 'Account Created! Redirecting...'
        submitBtn.classList.add('bg-green-600')
        setTimeout(() => {
          window.location.href = '../index.html'
        }, 1000)

      } catch (err) {
        errorMsg.textContent = err.message || 'Registration failed. Please check your details.'
        errorMsg.classList.remove('hidden')
        submitBtn.disabled = false
        submitBtn.textContent = 'Create Account'
      }
    })
  </script>
</body>
</html>
