<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Listing - CCM 2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
  <nav id="main-navbar"></nav>

  <div class="max-w-2xl mx-auto px-4 py-8">
    <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 sm:p-8 shadow-sm border border-gray-200 dark:border-gray-700">
      
      <div class="flex items-center justify-between pb-4 mb-6 border-b border-gray-100 dark:border-gray-700">
        <div>
          <h1 class="text-xl font-black text-blue-600 dark:text-blue-400">Edit Product Listing</h1>
          <p class="text-xs text-gray-400">Update pricing, description, availability status or delete</p>
        </div>
        <a href="profile.html" class="text-xs font-bold text-gray-500 hover:underline">← Cancel</a>
      </div>

      <div id="loading" class="text-center py-12 text-xs text-gray-400 animate-pulse">
        Loading product details...
      </div>

      <form id="edit-form" class="space-y-4 hidden">
        
        <div>
          <label class="block text-xs font-bold mb-1">Product Title *</label>
          <input type="text" id="title" required class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold mb-1">Price (₹) *</label>
            <input type="number" id="price" required min="1" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">Availability Status *</label>
            <select id="status" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
              <option value="available">🟢 Available for Sale</option>
              <option value="sold">🔴 Mark as Sold</option>
              <option value="inactive">⚪ Inactive / Hidden</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold mb-1">Category *</label>
            <select id="category" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm">
              <option value="Books & Notes">Books & Notes</option>
              <option value="Cycles & Vehicles">Cycles & Vehicles</option>
              <option value="Electronics & Laptops">Electronics & Laptops</option>
              <option value="Lab & Study Equipment">Lab & Study Equipment</option>
              <option value="Hostel & Room Essentials">Hostel & Room Essentials</option>
              <option value="Mobile & Accessories">Mobile & Accessories</option>
              <option value="Sports & Fitness">Sports & Fitness</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">Condition *</label>
            <select id="condition" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm">
              <option value="New">New</option>
              <option value="Like new">Like new</option>
              <option value="Used">Used</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold mb-1">Campus Meeting Point</label>
          <input type="text" id="meeting-point" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-bold mb-1">Description</label>
          <textarea id="description" rows="3" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <div id="status-msg" class="text-xs font-semibold text-center hidden p-2.5 rounded-lg"></div>

        <div class="flex gap-3 pt-3">
          <button type="submit" id="save-btn" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow">
            Save Changes
          </button>
          <button type="button" id="delete-btn" class="px-5 bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 font-bold py-3 rounded-xl transition text-xs">
            🗑️ Delete Listing
          </button>
        </div>

      </form>

    </div>
  </div>

  <script type="module" src="../js/theme.js"></script>
  <script type="module" src="../js/i18n.js"></script>
  <script type="module" src="../js/mode.js"></script>
  <script type="module" src="../js/navbar.js"></script>
  <script type="module">
    import { supabase, getCurrentUser } from '../js/supabase.js'

    const urlParams = new URLSearchParams(window.location.search)
    const productId = urlParams.get('id')

    let currentProduct = null

    async function loadItem() {
      if (!productId) {
        alert('Product ID missing')
        window.location.href = 'profile.html'
        return
      }

      const user = await getCurrentUser()
      if (!user) {
        window.location.href = 'login.html'
        return
      }

      try {
        const { data, error } = await supabase.from('products').select('*').eq('id', productId).single()
        if (data) currentProduct = data
      } catch (e) {}

      if (!currentProduct) {
        // Look in local fallback
        const local = JSON.parse(localStorage.getItem('ccm_fallback_products') || '[]')
        currentProduct = local.find(p => p.id === productId)
      }

      if (!currentProduct) {
        document.getElementById('loading').textContent = 'Product not found'
        return
      }

      document.getElementById('loading').classList.add('hidden')
      document.getElementById('edit-form').classList.remove('hidden')

      document.getElementById('title').value = currentProduct.title || ''
      document.getElementById('price').value = currentProduct.price || 0
      document.getElementById('status').value = currentProduct.status || 'available'
      document.getElementById('category').value = currentProduct.category || 'Books & Notes'
      document.getElementById('condition').value = currentProduct.condition || 'Used'
      document.getElementById('meeting-point').value = currentProduct.meeting_point || currentProduct.pickup_location || 'Main Gate'
      document.getElementById('description').value = currentProduct.description || ''
    }

    document.getElementById('edit-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const saveBtn = document.getElementById('save-btn')
      const msg = document.getElementById('status-msg')
      saveBtn.disabled = true
      saveBtn.textContent = 'Saving...'

      const updates = {
        title: document.getElementById('title').value.trim(),
        price: parseFloat(document.getElementById('price').value),
        status: document.getElementById('status').value,
        category: document.getElementById('category').value,
        condition: document.getElementById('condition').value,
        meeting_point: document.getElementById('meeting-point').value.trim(),
        description: document.getElementById('description').value.trim(),
        updated_at: new Date().toISOString()
      }

      try {
        await supabase.from('products').update(updates).eq('id', productId)
        msg.className = 'text-xs font-semibold text-center p-2.5 rounded-lg bg-green-50 text-green-700 block'
        msg.textContent = 'Listing updated successfully! ✓'
        setTimeout(() => window.location.href = 'profile.html', 1000)
      } catch (err) {
        msg.className = 'text-xs font-semibold text-center p-2.5 rounded-lg bg-red-50 text-red-700 block'
        msg.textContent = err.message || 'Update failed'
        saveBtn.disabled = false
      }
    })

    document.getElementById('delete-btn').addEventListener('click', async () => {
      if (!confirm('Are you sure you want to permanently delete this listing?')) return
      try {
        await supabase.from('products').delete().eq('id', productId)
      } catch (e) {}
      alert('Listing deleted.')
      window.location.href = 'profile.html'
    })

    loadItem()
  </script>
</body>
</html>
