<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - CCM 2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 flex flex-col justify-between min-h-screen">
  <nav id="main-navbar"></nav>

  <div class="max-w-md w-full mx-auto px-4 py-12">
    <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-md border border-gray-200 dark:border-gray-700">
      
      <div class="text-center mb-6">
        <span class="text-4xl block mb-2">🔑</span>
        <h2 class="text-2xl font-black text-blue-600 dark:text-blue-400">Reset Password</h2>
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">
          Enter your registered email address to receive password reset instructions.
        </p>
      </div>

      <form id="forgot-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold mb-1">Email Address</label>
          <input type="email" id="email" required placeholder="name@college.edu or gmail"
                 class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
        </div>

        <div id="status-msg" class="text-xs font-semibold text-center hidden p-3 rounded-lg"></div>

        <button type="submit" id="reset-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-md">
          Send Reset Instructions
        </button>
      </form>

      <div class="mt-6 text-center text-xs text-gray-500 dark:text-gray-400 border-t border-gray-100 dark:border-gray-700 pt-4">
        Remembered your password? 
        <a href="login.html" class="text-blue-600 dark:text-blue-400 font-bold hover:underline">Back to Login</a>
      </div>

    </div>
  </div>

  <div class="py-4"></div>

  <script type="module" src="../js/theme.js"></script>
  <script type="module" src="../js/i18n.js"></script>
  <script type="module" src="../js/mode.js"></script>
  <script type="module" src="../js/navbar.js"></script>
  <script type="module">
    import { supabase } from '../js/supabase.js'

    const form = document.getElementById('forgot-form')
    const resetBtn = document.getElementById('reset-btn')
    const statusMsg = document.getElementById('status-msg')

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      statusMsg.classList.add('hidden')
      resetBtn.disabled = true
      resetBtn.textContent = 'Sending...'

      const email = document.getElementById('email').value.trim()

      try {
        const { error } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + '/pages/edit-profile.html?reset=true'
        })

        statusMsg.className = 'text-xs font-semibold text-center p-3 rounded-lg bg-green-50 dark:bg-green-950/40 text-green-700 dark:text-green-300 border border-green-200 dark:border-green-800'
        statusMsg.textContent = 'Password reset instructions have been dispatched to ' + email + '. Check your inbox!'
        statusMsg.classList.remove('hidden')
        resetBtn.textContent = 'Sent ✓'
      } catch (err) {
        statusMsg.className = 'text-xs font-semibold text-center p-3 rounded-lg bg-blue-50 dark:bg-blue-950/40 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-800'
        statusMsg.textContent = 'Reset request recorded for ' + email + '. (Demo mode active).'
        statusMsg.classList.remove('hidden')
        resetBtn.textContent = 'Sent ✓'
      }
    })
  </script>
</body>
</html>
