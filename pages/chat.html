<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat & Price Negotiation - CCM 2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 flex flex-col h-screen overflow-hidden">
  <nav id="main-navbar"></nav>

  <!-- Product & Seller Context Top Bar -->
  <div id="chat-header-bar" class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center gap-3">
      <a href="chats.html" class="text-xs font-bold text-gray-400 hover:text-blue-600">← Back</a>
      <img id="chat-product-img" src="https://via.placeholder.com/50" class="w-10 h-10 object-cover rounded-lg border">
      <div>
        <h3 id="chat-party-name" class="font-bold text-xs truncate max-w-[150px] sm:max-w-xs">Connecting...</h3>
        <p id="chat-product-title" class="text-[11px] text-gray-400 truncate max-w-[150px] sm:max-w-xs">Item</p>
      </div>
    </div>

    <!-- Negotiation & Safety Tools -->
    <div class="flex items-center gap-2">
      <span id="chat-product-price" class="font-black text-sm text-blue-600 dark:text-blue-400 hidden sm:inline">₹0</span>
      <button id="make-offer-btn" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs rounded-xl shadow transition">
        🤝 Offer
      </button>
      <button id="block-user-btn" class="px-2.5 py-1.5 bg-gray-100 dark:bg-gray-700 text-gray-500 hover:text-red-500 text-xs rounded-xl" title="Block User">
        🚫
      </button>
    </div>
  </div>

  <!-- Active Offer Banner (if an offer is pending) -->
  <div id="offer-banner" class="hidden bg-amber-50 dark:bg-amber-950/40 border-b border-amber-200 dark:border-amber-800 px-4 py-2 text-xs flex items-center justify-between">
    <span id="offer-banner-text" class="text-amber-800 dark:text-amber-200 font-semibold">Offer pending...</span>
    <div class="flex gap-1.5" id="offer-actions">
      <button id="accept-offer-btn" class="px-2.5 py-1 bg-green-600 text-white font-bold rounded-lg text-[10px]">Accept</button>
      <button id="reject-offer-btn" class="px-2.5 py-1 bg-red-600 text-white font-bold rounded-lg text-[10px]">Reject</button>
    </div>
  </div>

  <!-- Messages Scroll Container -->
  <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-3">
    <div class="text-center py-10 text-xs text-gray-400">Loading messages...</div>
  </div>

  <!-- Message Input Bar -->
  <form id="message-form" class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 p-3 flex gap-2">
    <input type="text" id="message-input" placeholder="Type message or ask about campus handover..." required
           class="flex-1 px-4 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-xs focus:ring-2 focus:ring-blue-500">
    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2.5 rounded-xl text-xs shadow">
      Send
    </button>
  </form>

  <!-- Offer Modal -->
  <div id="chat-offer-modal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl max-w-xs w-full shadow-2xl space-y-4">
      <h3 class="font-bold text-sm">Make a Counter / New Offer</h3>
      <input type="number" id="offer-modal-val" placeholder="Offer price (₹)" class="w-full px-3 py-2 border rounded-xl text-sm font-bold bg-gray-50 dark:bg-gray-700">
      <div class="flex gap-2">
        <button id="cancel-chat-offer" class="flex-1 py-2 bg-gray-200 dark:bg-gray-700 rounded-xl text-xs font-bold">Cancel</button>
        <button id="send-chat-offer" class="flex-1 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold shadow">Send</button>
      </div>
    </div>
  </div>

  <script type="module" src="../js/theme.js"></script>
  <script type="module" src="../js/i18n.js"></script>
  <script type="module" src="../js/mode.js"></script>
  <script type="module" src="../js/navbar.js"></script>
  <script type="module">
    import { supabase, getCurrentUser, safeDbInsert } from '../js/supabase.js'

    const urlParams = new URLSearchParams(window.location.search)
    let productId = urlParams.get('product')
    let sellerId = urlParams.get('seller')
    let convId = urlParams.get('conv')

    const msgsContainer = document.getElementById('messages-container')
    const messageForm = document.getElementById('message-form')
    const messageInput = document.getElementById('message-input')

    let currentUser = null
    let currentProduct = null
    let localMessages = []
    let pollInterval = null

    async function initChat() {
      currentUser = await getCurrentUser()
      if (!currentUser) {
        alert('Please login to chat')
        window.location.href = 'login.html'
        return
      }

      // 1. If convId is provided, load the conversation first
      let currentConv = null
      if (convId) {
        try {
          const { data } = await supabase.from('conversations').select('*, products(*)').eq('id', convId).single()
          if (data) currentConv = data
        } catch (e) {}

        if (!currentConv) {
          const localConvs = JSON.parse(localStorage.getItem('ccm_fallback_conversations') || '[]')
          currentConv = localConvs.find(c => c.id === convId)
        }
      }

      // 2. If convId not in URL, try resolving existing conversation
      if (!currentConv && productId && sellerId) {
        // Self-chat check ONLY when starting a brand new conversation
        if (currentUser.id === sellerId) {
          alert('⚠️ You cannot start a chat with yourself on your own product listing.')
          window.location.href = `product.html?id=${productId}`
          return
        }

        try {
          const { data } = await supabase
            .from('conversations')
            .select('*, products(*)')
            .eq('product_id', productId)
            .eq('buyer_id', currentUser.id)
            .eq('seller_id', sellerId)
            .maybeSingle()
          if (data) {
            currentConv = data
            convId = data.id
            window.history.replaceState({}, '', `chat.html?product=${productId}&seller=${sellerId}&conv=${convId}`)
          }
        } catch (e) {}

        if (!currentConv) {
          const fallbackConvs = JSON.parse(localStorage.getItem('ccm_fallback_conversations') || '[]')
          const matched = fallbackConvs.find(c => c.product_id === productId && c.buyer_id === currentUser.id && c.seller_id === sellerId)
          if (matched) {
            currentConv = matched
            convId = matched.id
            window.history.replaceState({}, '', `chat.html?product=${productId}&seller=${sellerId}&conv=${convId}`)
          }
        }
      }

      // 3. Handle active conversation participants & roles
      if (currentConv) {
        productId = currentConv.product_id || productId
        sellerId = currentConv.seller_id || sellerId

        const isBuyer = currentUser.id === currentConv.buyer_id
        const isSeller = currentUser.id === currentConv.seller_id

        if (currentConv.buyer_id === currentConv.seller_id) {
          alert('⚠️ Invalid self-chat conversation.')
          window.location.href = 'chats.html'
          return
        }

        if (!isBuyer && !isSeller) {
          alert('⚠️ You are not a participant in this conversation.')
          window.location.href = 'chats.html'
          return
        }

        // Show the other party's name & role
        const otherPartyName = isSeller ? (currentConv.buyer_name || 'Buyer') : (currentConv.seller_name || 'Seller')
        const otherRole = isSeller ? 'Buyer' : 'Seller'
        document.getElementById('chat-party-name').textContent = `${otherPartyName} (${otherRole})`
      } else {
        // Starting fresh without convId: show seller name
        if (sellerId && sellerId !== currentUser.id) {
          try {
            const { data: sProf } = await supabase.from('profiles').select('name, full_name').eq('id', sellerId).single()
            if (sProf) {
              document.getElementById('chat-party-name').textContent = sProf.full_name || sProf.name || 'Campus Seller'
            }
          } catch (e) {}
        }
      }

      // 4. Load Product Info
      if (productId) {
        try {
          const { data } = await supabase.from('products').select('*, profiles(name, full_name, is_verified)').eq('id', productId).single()
          if (data) currentProduct = data
        } catch (e) {}

        if (!currentProduct) {
          const local = JSON.parse(localStorage.getItem('ccm_fallback_products') || '[]')
          currentProduct = local.find(p => p.id === productId)
        }
      }

      if (currentProduct) {
        const photo = currentProduct.photos?.[0] || currentProduct.image_url || 'https://via.placeholder.com/60'
        document.getElementById('chat-product-img').src = photo
        document.getElementById('chat-product-title').textContent = currentProduct.title
        document.getElementById('chat-product-price').textContent = currentProduct.price ? `₹${currentProduct.price}` : ''
      }

      // 5. Load Messages & start live polling
      await loadMessages()

      if (pollInterval) clearInterval(pollInterval)
      pollInterval = setInterval(loadMessages, 3000)
    }

    async function ensureConversation() {
      if (convId) return convId

      const convRecord = {
        product_id: productId || null,
        buyer_id: currentUser.id,
        seller_id: sellerId || null,
        buyer_name: currentUser.name || currentUser.full_name || 'Buyer',
        seller_name: document.getElementById('chat-party-name').textContent || 'Seller'
      }

      try {
        const { data, error } = await supabase.from('conversations').insert(convRecord).select().single()
        if (!error && data) {
          convId = data.id
        }
      } catch (e) {}

      if (!convId) {
        const newId = (typeof crypto !== 'undefined' && crypto.randomUUID) 
          ? crypto.randomUUID() 
          : 'conv_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6)
        convId = newId

        const list = JSON.parse(localStorage.getItem('ccm_fallback_conversations') || '[]')
        list.unshift({
          id: convId,
          created_at: new Date().toISOString(),
          ...convRecord,
          products: currentProduct
        })
        localStorage.setItem('ccm_fallback_conversations', JSON.stringify(list))
      }

      window.history.replaceState({}, '', `chat.html?product=${productId || ''}&seller=${sellerId || ''}&conv=${convId}`)
      return convId
    }

    async function loadMessages() {
      if (!convId) {
        if (localMessages.length === 0) {
          msgsContainer.innerHTML = `
            <div class="text-center py-12 px-4 space-y-2">
              <span class="text-4xl block">💬</span>
              <p class="font-bold text-xs text-gray-700 dark:text-gray-300">Start conversation with seller</p>
              <p class="text-[11px] text-gray-400 max-w-xs mx-auto">Ask about the item, verify its condition, or suggest a campus meeting point.</p>
            </div>
          `
        }
        return
      }

      let dbMessages = []
      try {
        const { data, error } = await supabase
          .from('messages')
          .select('*')
          .eq('conversation_id', convId)
          .order('created_at', { ascending: true })

        if (!error && data) dbMessages = data
      } catch (e) {}

      const localKey = `ccm_fallback_messages_${convId}`
      const localStash = JSON.parse(localStorage.getItem(localKey) || '[]')

      // Merge avoiding duplicates by id or content+created_at
      const map = new Map()
      dbMessages.forEach(m => map.set(m.id || `${m.content}_${m.created_at}`, m))
      localStash.forEach(m => map.set(m.id || `${m.content}_${m.created_at}`, m))

      const merged = Array.from(map.values()).sort((a, b) => new Date(a.created_at || 0) - new Date(b.created_at || 0))

      if (merged.length !== localMessages.length || JSON.stringify(merged) !== JSON.stringify(localMessages)) {
        localMessages = merged
        renderMessages()
      }
    }

    function renderMessages() {
      if (localMessages.length === 0) {
        msgsContainer.innerHTML = `
          <div class="text-center py-12 px-4 space-y-2">
            <span class="text-4xl block">💬</span>
            <p class="font-bold text-xs text-gray-700 dark:text-gray-300">No messages yet</p>
            <p class="text-[11px] text-gray-400 max-w-xs mx-auto">Send a message below to start chatting with the seller!</p>
          </div>
        `
        return
      }

      msgsContainer.innerHTML = localMessages.map(m => {
        const isMe = m.sender_id === currentUser.id
        return `
          <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
            <div class="max-w-[75%] p-3 rounded-2xl text-xs leading-relaxed ${
              isMe 
                ? 'bg-blue-600 text-white rounded-br-xs shadow-sm' 
                : 'bg-white dark:bg-gray-800 text-gray-800 dark:text-gray-200 border border-gray-200 dark:border-gray-700 rounded-bl-xs shadow-sm'
            }">
              <p>${m.content}</p>
              <span class="text-[9px] block text-right mt-1 opacity-70">
                ${new Date(m.created_at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
              </span>
            </div>
          </div>
        `
      }).join('')
      msgsContainer.scrollTop = msgsContainer.scrollHeight
    }

    messageForm.onsubmit = async (e) => {
      e.preventDefault()
      const text = messageInput.value.trim()
      if (!text) return

      await ensureConversation()

      const newMsg = {
        conversation_id: convId,
        sender_id: currentUser.id,
        content: text,
        is_read: false,
        created_at: new Date().toISOString()
      }

      // Immediately show in UI
      localMessages.push(newMsg)
      messageInput.value = ''
      renderMessages()

      // Save to local fallback
      const localKey = `ccm_fallback_messages_${convId}`
      const localStash = JSON.parse(localStorage.getItem(localKey) || '[]')
      localStash.push(newMsg)
      localStorage.setItem(localKey, JSON.stringify(localStash))

      // Update conversation in fallback list
      const convList = JSON.parse(localStorage.getItem('ccm_fallback_conversations') || '[]')
      const cIdx = convList.findIndex(c => c.id === convId)
      if (cIdx >= 0) {
        convList[cIdx].messages = localStash
        localStorage.setItem('ccm_fallback_conversations', JSON.stringify(convList))
      }

      // Try save to Supabase
      try {
        await supabase.from('messages').insert({
          conversation_id: convId,
          sender_id: currentUser.id,
          content: text,
          is_read: false
        })
      } catch (err) {
        console.warn('Supabase message insert fallback engaged:', err)
      }
    }

    // Offer Handlers
    document.getElementById('make-offer-btn').onclick = () => {
      document.getElementById('chat-offer-modal').classList.remove('hidden')
    }
    document.getElementById('cancel-chat-offer').onclick = () => {
      document.getElementById('chat-offer-modal').classList.add('hidden')
    }
    document.getElementById('send-chat-offer').onclick = async () => {
      const val = document.getElementById('offer-modal-val').value
      if (val) {
        await ensureConversation()
        const offerText = `🤝 Proposed a counter-offer: ₹${val}`
        const offerMsg = {
          conversation_id: convId,
          sender_id: currentUser.id,
          content: offerText,
          is_read: false,
          created_at: new Date().toISOString()
        }
        localMessages.push(offerMsg)
        renderMessages()

        const localKey = `ccm_fallback_messages_${convId}`
        const localStash = JSON.parse(localStorage.getItem(localKey) || '[]')
        localStash.push(offerMsg)
        localStorage.setItem(localKey, JSON.stringify(localStash))

        try {
          await supabase.from('messages').insert({
            conversation_id: convId,
            sender_id: currentUser.id,
            content: offerText
          })
          if (productId && sellerId) {
            await supabase.from('offers').insert({
              product_id: productId,
              conversation_id: convId,
              buyer_id: currentUser.id,
              seller_id: sellerId,
              original_price: currentProduct?.price || 0,
              offer_price: parseFloat(val),
              status: 'pending'
            })
          }
        } catch (e) {}

        document.getElementById('chat-offer-modal').classList.add('hidden')
      }
    }

    // Block user handler
    document.getElementById('block-user-btn').onclick = () => {
      if (confirm('Block this user from messaging you?')) {
        alert('User has been blocked.')
        window.location.href = 'chats.html'
      }
    }

    initChat()
  </script>
</body>
</html>
