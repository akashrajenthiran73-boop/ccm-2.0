<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - CCM 2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <!-- Theme Animations CSS -->
<link rel="stylesheet" href="../css/theme-animations.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
  <nav class="bmw-navbar bg-white dark:bg-gray-800 shadow-md p-4 transition-colors animate-fade-down">
    <div class="max-w-6xl mx-auto">
      <a href="../index.html" class="text-2xl font-bold text-blue-600 dark:text-blue-400 bmw-hover px-3 py-1 rounded-lg">CCM 2.0</a>
    </div>
  </nav>

  <div class="max-w-4xl mx-auto p-4 page-transition">
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow hover-lift animate-scale-in h-[80vh] flex flex-col transition-colors">
      <div id="product-info" class="p-4 border-b dark:border-gray-700 flex items-center gap-3">
        <div class="animate-pulse text-gray-400 dark:text-gray-500">Loading product...</div>
      </div>

      <div id="messages" class="spider-web flex-1 overflow-y-auto p-4 space-y-3">
        <div class="text-center text-gray-400 dark:text-gray-500 animate-pulse">Connecting...</div>
      </div>

      <div class="p-4 border-t dark:border-gray-700">
        <form id="message-form" class="flex gap-2">
          <input id="message-input" type="text" placeholder="Type a message..."
                 class="flex-1 border dark:border-gray-600 rounded-lg px-4 py-2 bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all" required>
          <button type="submit" class="transformer-btn bmw-hover bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 active:scale-95 transition">Send 🚀</button>
        </form>
      </div>
    </div>
  </div>

  <!-- Global Theme Button - INLINE -->
  <script>
    const html = document.documentElement
    const THEME_KEY = 'ccm-theme'

    function applyTheme() {
      const saved = localStorage.getItem(THEME_KEY)
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        html.classList.add('dark')
      } else {
        html.classList.remove('dark')
      }
    }

    function toggleTheme() {
      html.classList.toggle('dark')
      const isDark = html.classList.contains('dark')
      localStorage.setItem(THEME_KEY, isDark? 'dark' : 'light')
      window.dispatchEvent(new CustomEvent('themeChanged', { detail: { isDark } }))
      return isDark? '☀️' : '🌙'
    }

    function getThemeIcon() {
      return html.classList.contains('dark')? '☀️' : '🌙'
    }

    applyTheme()

    const btn = document.createElement('button')
    btn.id = 'global-theme-toggle'
    btn.className = 'fixed bottom-6 right-6 z-50 text-2xl p-4 rounded-full bg-white dark:bg-gray-800 shadow-2xl hover:scale-110 active:scale-95 transition-all border-2 border-gray-200 dark:border-gray-700 transformer-btn'
    btn.textContent = getThemeIcon()
    btn.title = 'Toggle Theme'
    btn.onclick = () => {
      btn.textContent = toggleTheme()
    }

    window.addEventListener('themeChanged', (e) => {
      btn.textContent = e.detail.isDark? '☀️' : '🌙'
    })

    document.body.appendChild(btn)
  </script>

  <script type="module">
    import { supabase } from '../js/supabase.js'

    const urlParams = new URLSearchParams(window.location.search)
    const productId = urlParams.get('product')
    const convIdFromUrl = urlParams.get('conv')
    const sellerParamFromUrl = urlParams.get('seller')

    let currentUser = null
    let conversationId = convIdFromUrl || null
    let sellerId = null
    let conversationData = null
    const messagesDiv = document.getElementById('messages')

    async function initChat() {
      try {
        const { data: { user }, error: authError } = await supabase.auth.getUser()
        if (authError ||!user) {
          window.location.href = 'login.html'
          return
        }
        currentUser = user

        if (!productId &&!conversationId) {
          messagesDiv.innerHTML = '<div class="text-center text-red-500 dark:text-red-400 animate-shake">No product or chat ID found</div>'
          return
        }

        let finalProductId = productId
        if (conversationId &&!productId) {
          const { data: convoTemp } = await supabase
       .from('conversations')
       .select('product_id')
       .eq('id', conversationId)
       .single()
          finalProductId = convoTemp?.product_id
        }

        const { data: product, error: prodError } = await supabase
     .from('products')
     .select('*')
     .eq('id', finalProductId)
     .single()

        if (prodError) throw new Error('Product not found: ' + prodError.message)

        sellerId = product.seller_id || product.user_id

        if (conversationId) {
          const { data: convo } = await supabase
       .from('conversations')
       .select('*')
       .eq('id', conversationId)
       .single()
          conversationData = convo
        } else {
          const { data: convoList } = await supabase
       .from('conversations')
       .select('*')
       .eq('product_id', finalProductId)
       .eq('buyer_id', currentUser.id)
       .eq('seller_id', sellerId)

          if (convoList && convoList.length > 0) {
            conversationId = convoList[0].id
            conversationData = convoList[0]
          } else {
            if (sellerParamFromUrl && String(currentUser.id) === String(sellerId)) {
              messagesDiv.innerHTML = '<div class="text-center text-red-500 dark:text-red-400 py-10 animate-shake">You cannot chat with yourself<br><span class="text-sm text-gray-500 dark:text-gray-400">This is your own product</span></div>'
              document.getElementById('message-form').style.display = 'none'
              return
            }

            const buyerName = currentUser.user_metadata?.full_name ||
                              currentUser.user_metadata?.name ||
                              currentUser.email?.split('@')[0] || 'Buyer'

            const { data: sellerUser } = await supabase
         .from('profiles')
         .select('name')
         .eq('id', sellerId)
         .single()

            const sellerName = sellerUser?.name || 'Seller'

            const { data: newConvo, error: newConvoError } = await supabase
         .from('conversations')
         .insert({
                product_id: finalProductId,
                buyer_id: currentUser.id,
                seller_id: sellerId,
                buyer_name: buyerName,
                seller_name: sellerName
              })
         .select()
         .single()

            if (newConvoError) throw new Error('Cannot create chat: ' + newConvoError.message)
            conversationId = newConvo.id
            conversationData = newConvo
          }
        }

        const isUserSeller = String(currentUser.id) === String(sellerId)
        const otherPartyName = isUserSeller
     ? conversationData?.buyer_name || 'Buyer'
          : 'Seller'

        document.getElementById('product-info').innerHTML = `
          <img src="${product.photos?.[0] || product.image_url || 'https://via.placeholder.com/50'}" class="w-12 h-12 object-cover rounded hover-scale">
          <div>
            <h3 class="font-bold text-gray-900 dark:text-white">${product.title}</h3>
            <p class="text-sm text-gray-500 dark:text-gray-400">${isUserSeller? `Chat with ${otherPartyName}` : 'Chat with Seller'}</p>
          </div>
          <p class="ml-auto font-bold text-blue-600 dark:text-blue-400">₹${product.price}</p>
        `

        await loadMessages(conversationId)

        supabase
     .channel('messages-' + conversationId)
     .on('postgres_changes', {
            event: 'INSERT',
            schema: 'public',
            table: 'messages',
            filter: `conversation_id=eq.${conversationId}`
          }, () => loadMessages(conversationId))
     .subscribe()

      } catch (err) {
        console.error('Chat init error:', err)
        messagesDiv.innerHTML = `<div class="text-center text-red-500 dark:text-red-400 animate-shake">Error: ${err.message}</div>`
      }
    }

    async function loadMessages(convId) {
      const { data: messages, error } = await supabase
   .from('messages')
   .select('*')
   .eq('conversation_id', convId)
   .order('created_at', { ascending: true })

      if (error) {
        console.error('Error loading messages:', error)
        messagesDiv.innerHTML = `<div class="text-center text-red-500 dark:text-red-400 animate-shake">Error: ${error.message}</div>`
        return
      }

      // ✅ UNREAD MARK PANNU: Other party msg ah read aakidu
      const unreadMsgIds = messages
   .filter(msg => msg.sender_id!== currentUser.id &&!msg.is_read)
   .map(msg => msg.id)

      if (unreadMsgIds.length > 0) {
        await supabase
     .from('messages')
     .update({ is_read: true })
     .in('id', unreadMsgIds)
      }

      if (!messages || messages.length === 0) {
        messagesDiv.innerHTML = '<div class="text-center text-gray-400 dark:text-gray-500 animate-fade-in">No messages yet. Start the conversation!</div>'
        return
      }

      messagesDiv.innerHTML = messages.map((msg, index) => {
        const isMe = String(msg.sender_id) === String(currentUser.id)
        const senderName = isMe
     ? 'You'
          : (String(msg.sender_id) === String(conversationData?.seller_id)
       ? conversationData?.seller_name
            : conversationData?.buyer_name) || 'User'

        // 🔥 SPIDER MESSAGE ANIMATION - New message ku
        const isNewMessage = index === messages.length - 1

        return `
          <div class="flex ${isMe? 'justify-end' : 'justify-start'} mb-3 animate-fade-in">
            <div class="${isMe? 'bg-blue-600 text-white spider-message' : 'bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-white hover-scale'} px-4 py-2 rounded-2xl max-w-xs break-words shadow-sm">
              ${!isMe? `<div class="text-xs font-bold mb-1 opacity-70">${senderName}</div>` : ''}
              <p class="text-sm">${msg.content}</p>
              <p class="text-xs ${isMe? 'text-blue-100' : 'text-gray-500 dark:text-gray-400'} mt-1 text-right">
                ${new Date(msg.created_at).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}
              </p>
            </div>
          </div>
        `
      }).join('')

      messagesDiv.scrollTop = messagesDiv.scrollHeight
    }

    document.getElementById('message-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const input = document.getElementById('message-input')
      const content = input.value.trim()

      if (!content) return
      if (!conversationId) {
        alert('Chat not ready yet. Please wait.')
        return
      }

      const { error } = await supabase
   .from('messages')
   .insert({
          conversation_id: conversationId,
          sender_id: currentUser.id,
          content: content,
          is_read: false
        })

      if (error) {
        alert('Error sending: ' + error.message)
        console.error(error)
      } else {
        input.value = ''
      }
    })

    initChat()
  </script>
  <!-- Theme Effects JS -->
<script type="module" src="../js/theme-effects.js"></script>
</body>
</html>
