<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist & Saved Items - CCM 2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
  <nav id="main-navbar"></nav>

  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-black flex items-center gap-2 text-red-500">
          <span>❤️</span> My Wishlist & Saved Items
        </h1>
        <p class="text-xs text-gray-400 mt-1">Saved campus listings with instant price drop alerts</p>
      </div>
      <a href="../index.html" class="text-xs font-bold text-blue-600 dark:text-blue-400 hover:underline">
        + Browse More
      </a>
    </div>

    <!-- Wishlist Grid -->
    <div id="wishlist-feed" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
      <div class="col-span-full text-center py-16 text-gray-400 text-xs animate-pulse">Loading saved items...</div>
    </div>

  </div>

  <script type="module" src="../js/theme.js"></script>
  <script type="module" src="../js/i18n.js"></script>
  <script type="module" src="../js/mode.js"></script>
  <script type="module" src="../js/navbar.js"></script>
  <script type="module">
    import { supabase, getCurrentUser } from '../js/supabase.js'
    import { addToCart } from '../js/cart.js'

    const feed = document.getElementById('wishlist-feed')
    let currentUser = null

    async function initWishlist() {
      currentUser = await getCurrentUser()
      if (!currentUser) {
        alert('Please login to view your saved wishlist')
        window.location.href = 'login.html'
        return
      }

      try {
        const { data, error } = await supabase
          .from('wishlists')
          .select('*, products(*)')
          .eq('user_id', currentUser.id)

        if (!error && data && data.length > 0) {
          renderWishlist(data.map(w => w.products).filter(Boolean))
          return
        }
      } catch (e) {}

      // If empty, show friendly empty state
      feed.innerHTML = `
        <div class="col-span-full bg-white dark:bg-gray-800 rounded-3xl p-12 text-center border border-gray-200 dark:border-gray-700">
          <span class="text-5xl block mb-3">🤍</span>
          <p class="font-bold text-base">Your Wishlist is Empty</p>
          <p class="text-xs text-gray-400 mt-1 mb-5">Tap the heart icon on any listing to bookmark it here.</p>
          <a href="../index.html" class="inline-block px-5 py-2.5 bg-blue-600 text-white font-bold text-xs rounded-xl shadow">Explore Campus Items</a>
        </div>
      `
    }

    function renderWishlist(products) {
      feed.innerHTML = products.map(p => `
        <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm overflow-hidden flex flex-col justify-between hover-lift">
          <div class="relative">
            <img src="${p.photos?.[0] || 'https://via.placeholder.com/300'}" class="w-full h-44 object-cover">
            
            <!-- Price drop badge simulation -->
            <span class="absolute top-2 left-2 px-2 py-0.5 rounded-full text-[10px] font-black bg-emerald-500 text-white shadow">
              📉 Price Drop Alert!
            </span>

            <button onclick="removeSaved('${p.id}')" class="absolute top-2 right-2 w-8 h-8 bg-white/90 dark:bg-gray-800/90 rounded-full flex items-center justify-center text-red-500 shadow" title="Remove">
              ✕
            </button>
          </div>

          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">${p.category}</div>
              <h3 class="font-bold text-sm text-gray-900 dark:text-white truncate mt-1">${p.title}</h3>
              <div class="flex items-baseline gap-2 mt-2">
                <span class="text-xl font-black text-blue-600 dark:text-blue-400">₹${p.price}</span>
                ${p.original_price ? `<span class="text-xs text-gray-400 line-through">₹${p.original_price}</span>` : ''}
              </div>
            </div>

            <div class="grid grid-cols-2 gap-2 mt-4 pt-3 border-t border-gray-100 dark:border-gray-700">
              <button onclick="moveItemToCart('${p.id}', this)" class="py-2 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 text-xs font-bold rounded-xl transition">
                🛒 Add Cart
              </button>
              <a href="product.html?id=${p.id}" class="py-2 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl text-center shadow transition">
                View Item
              </a>
            </div>
          </div>
        </div>
      `).join('')
    }

    window.removeSaved = async (productId) => {
      try {
        await supabase.from('wishlists').delete().eq('user_id', currentUser.id).eq('product_id', productId)
      } catch (e) {}
      initWishlist()
    }

    window.moveItemToCart = async (productId, btn) => {
      try {
        const { data } = await supabase.from('products').select('*').eq('id', productId).single()
        if (data) await addToCart(data, 1)
      } catch (e) {}
      btn.textContent = '✓ Added!'
      btn.classList.add('text-green-600')
    }

    initWishlist()
  </script>
</body>
</html>
