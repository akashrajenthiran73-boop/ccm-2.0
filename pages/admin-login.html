<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login - CCM 2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-900 text-gray-100 flex items-center justify-center min-h-screen p-4">

  <div class="max-w-md w-full bg-gray-800 p-8 rounded-3xl border border-gray-700 shadow-2xl space-y-6">
    <div class="text-center">
      <div class="w-16 h-16 bg-blue-600/20 text-blue-400 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-3 border border-blue-500/30">
        ⚙️
      </div>
      <h1 class="text-2xl font-black tracking-tight text-white">Admin Management Portal</h1>
      <p class="text-xs text-gray-400 mt-1">Authorized personnel and campus moderators only</p>
    </div>

    <!-- Admin Credentials Callout Card -->
    <div class="p-3.5 bg-blue-950/60 border border-blue-800/80 rounded-2xl text-xs space-y-2 text-blue-200">
      <div class="font-bold flex items-center justify-between text-blue-400">
        <span class="flex items-center gap-1.5">🔑 Official Admin Credentials</span>
        <span class="text-[10px] px-2 py-0.5 rounded-full bg-blue-900/80 text-blue-300 font-mono">Master Access</span>
      </div>
      <div class="grid grid-cols-2 gap-2 text-[11px] pt-1">
        <div class="p-2 bg-gray-900/80 rounded-xl border border-gray-700">
          <span class="text-gray-400 block text-[10px] uppercase font-bold">Admin Username</span>
          <code class="font-bold text-white font-mono text-xs">admin</code>
          <span class="text-gray-400 text-[10px] block">or admin@ccm.edu</span>
        </div>
        <div class="p-2 bg-gray-900/80 rounded-xl border border-gray-700">
          <span class="text-gray-400 block text-[10px] uppercase font-bold">Admin Password</span>
          <code class="font-bold text-white font-mono text-xs">admin123</code>
          <span class="text-gray-400 text-[10px] block">or admin</span>
        </div>
      </div>
    </div>

    <form id="admin-login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-300 mb-1">Admin Username or Email *</label>
        <input type="text" id="admin-identifier" required placeholder="admin or admin@ccm.edu" value="admin"
               class="w-full px-3 py-2.5 rounded-xl border border-gray-700 bg-gray-900 text-sm focus:ring-2 focus:ring-blue-500 text-white">
      </div>

      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="block text-xs font-bold text-gray-300">Admin Password *</label>
          <span class="text-[10px] text-gray-400">Default: admin123</span>
        </div>
        <input type="password" id="admin-password" required placeholder="••••••••" value="admin123"
               class="w-full px-3 py-2.5 rounded-xl border border-gray-700 bg-gray-900 text-sm focus:ring-2 focus:ring-blue-500 text-white">
      </div>

      <div id="admin-error" class="text-xs text-red-400 font-semibold text-center hidden"></div>

      <button type="submit" id="admin-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-xs transition shadow flex items-center justify-center gap-2">
        <span>🔐</span> Authenticate as Admin
      </button>
    </form>

    <div class="text-center pt-2">
      <a href="../index.html" class="text-xs text-gray-400 hover:text-white">← Return to Public Site</a>
    </div>
  </div>

  <script type="module">
    import { supabase, isAdmin } from '../js/supabase.js'

    document.getElementById('admin-login-form').onsubmit = async (e) => {
      e.preventDefault()
      const identifier = document.getElementById('admin-identifier').value.trim()
      const password = document.getElementById('admin-password').value
      const btn = document.getElementById('admin-btn')
      const err = document.getElementById('admin-error')

      btn.disabled = true
      btn.textContent = 'Verifying credentials...'
      err.classList.add('hidden')

      // Check Master Admin Credentials
      const storedAdminUser = (localStorage.getItem('ccm_admin_username') || 'admin').toLowerCase()
      const storedAdminPass = localStorage.getItem('ccm_admin_password') || 'admin123'
      const cleanIdent = identifier.toLowerCase()

      const isValidMasterUser = cleanIdent === 'admin' || cleanIdent === 'admin@ccm.edu' || cleanIdent === storedAdminUser
      const isValidMasterPass = password === storedAdminPass || password === 'admin123' || password === 'admin'

      if (isValidMasterUser && isValidMasterPass) {
        const adminUser = {
          id: 'admin-master-id',
          email: identifier.includes('@') ? identifier : 'admin@ccm.edu',
          username: 'admin',
          full_name: 'Campus Administrator',
          role: 'admin',
          user_type: 'admin'
        }
        localStorage.setItem('ccm_admin_logged_in', 'true')
        localStorage.setItem('ccm_admin_user', JSON.stringify(adminUser))
        localStorage.setItem('ccm_demo_user', JSON.stringify(adminUser))
        localStorage.setItem('demo_role_admin-master-id', 'admin')
        window.location.href = 'admin.html'
        return
      }

      // If entered as an email, attempt Supabase Auth as secondary check
      if (identifier.includes('@')) {
        try {
          const { data, error } = await supabase.auth.signInWithPassword({ email: identifier, password })
          if (!error && data?.user) {
            const user = data.user
            const adminStatus = await isAdmin(user.id)
            if (adminStatus || identifier.includes('admin')) {
              localStorage.setItem('ccm_admin_logged_in', 'true')
              localStorage.setItem(`demo_role_${user.id}`, 'admin')
              window.location.href = 'admin.html'
              return
            }
          }
        } catch (authErr) {
          console.warn('Supabase auth note:', authErr)
        }
      }

      // If neither matched
      err.textContent = 'Invalid credentials. Use Username: admin | Password: admin123'
      err.classList.remove('hidden')
      btn.disabled = false
      btn.innerHTML = '<span>🔐</span> Authenticate as Admin'
    }
  </script>
</body>
</html>
