<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nearby Marketplace & Campus Map - CCM 2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="../css/style.css">
  
  <!-- Leaflet CSS & JS for Interactive Campus Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #campus-map { height: 400px; width: 100%; border-radius: 1rem; z-index: 10; }
  </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
  <nav id="main-navbar"></nav>

  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-8">
    
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-black flex items-center gap-2">
          <span>📍</span> Nearby Marketplace & Campus Map
        </h1>
        <p class="text-xs text-gray-400 mt-1">
          Explore items available within campus radius & designated safe meeting points
        </p>
      </div>

      <!-- Radius Filter Pills -->
      <div class="flex items-center gap-2 bg-white dark:bg-gray-800 p-1.5 rounded-2xl border border-gray-200 dark:border-gray-700 text-xs font-bold">
        <button id="rad-all" class="px-3 py-1.5 rounded-xl bg-blue-600 text-white shadow-sm transition">All Items</button>
        <button id="rad-5km" class="px-3 py-1.5 rounded-xl text-gray-600 dark:text-gray-300 hover:text-blue-600 transition">📍 Within 5 KM</button>
        <button id="rad-more" class="px-3 py-1.5 rounded-xl text-gray-600 dark:text-gray-300 hover:text-blue-600 transition">More than 5 KM</button>
      </div>
    </div>

    <!-- Map Container -->
    <div class="bg-white dark:bg-gray-800 p-4 rounded-3xl shadow-sm border border-gray-200 dark:border-gray-700 mb-8">
      <div class="flex items-center justify-between mb-3 text-xs">
        <div class="font-bold text-gray-700 dark:text-gray-300 flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-blue-600 inline-block"></span> Campus Landmarks & Meeting Points
          <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block ml-3"></span> Active Product Locations
        </div>
        <button id="detect-loc-btn" class="px-3 py-1 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 rounded-lg font-semibold flex items-center gap-1">
          <span>🎯</span> Locate Me
        </button>
      </div>
      <div id="campus-map"></div>
    </div>

    <!-- Nearby Products Feed -->
    <div class="mb-4 flex items-center justify-between">
      <h3 class="font-black text-lg">Nearby Items for Pickup</h3>
      <span class="text-xs text-gray-400" id="nearby-count">Calculating distances...</span>
    </div>

    <div id="nearby-products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
      <div class="col-span-full text-center py-12 text-xs text-gray-400">Loading nearby listings...</div>
    </div>

  </div>

  <script type="module" src="../js/theme.js"></script>
  <script type="module" src="../js/i18n.js"></script>
  <script type="module" src="../js/mode.js"></script>
  <script type="module" src="../js/navbar.js"></script>
  <script type="module">
    import { supabase } from '../js/supabase.js'
    import { createProductCard } from '../js/main.js'

    // Campus base coordinates (Coimbatore Campus)
    const CAMPUS_COORDS = [11.0270, 77.0275]
    let map = null
    let userMarker = null
    let userCoords = { lat: 11.0270, lng: 77.0275 }
    let radiusFilter = 'all'

    // Safe Campus Meeting Points
    const CAMPUS_POINTS = [
      { name: 'Campus Main Gate', coords: [11.0275, 77.0260], icon: '🚪', desc: 'Security monitored campus entrance' },
      { name: 'Central Library Front', coords: [11.0282, 77.0280], icon: '📚', desc: 'Central study hall lobby' },
      { name: 'Campus Canteen / Food Court', coords: [11.0260, 77.0290], icon: '☕', desc: 'Open cafeteria seating' },
      { name: 'Hostel Block 3 Entrance', coords: [11.0295, 77.0300], icon: '🏢', desc: 'Hostel security desk' }
    ]

    let nearbyProducts = []
    let productMarkersLayer = null

    // Haversine formula for distance in KM
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371
      const dLat = (lat2 - lat1) * Math.PI / 180
      const dLon = (lon2 - lon1) * Math.PI / 180
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2)
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))
      return R * c
    }

    function initMap() {
      map = L.map('campus-map').setView(CAMPUS_COORDS, 15)

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map)

      // Add Campus Landmarks
      CAMPUS_POINTS.forEach(pt => {
        L.marker(pt.coords).addTo(map).bindPopup(`
          <div class="text-xs">
            <b class="text-blue-600">${pt.icon} ${pt.name}</b><br>
            <span class="text-gray-500">${pt.desc}</span>
          </div>
        `)
      })

      productMarkersLayer = L.layerGroup().addTo(map)
    }

    async function loadNearbyProducts() {
      const countEl = document.getElementById('nearby-count')
      countEl.textContent = 'Loading campus listings...'

      let items = []
      try {
        const { data } = await supabase
          .from('products')
          .select('*, profiles(name, rating, is_verified, phone)')
          .in('status', ['active', 'available'])
          .order('created_at', { ascending: false })
          .limit(40)
        if (data && data.length > 0) items = data
      } catch (e) {
        console.warn('Nearby products fetch note:', e)
      }

      // Merge local listings
      try {
        const local = JSON.parse(localStorage.getItem('ccm_fallback_products') || '[]')
        local.forEach(l => {
          if (!items.some(it => it.id === l.id)) items.push(l)
        })
      } catch (e) {}

      // Filter by active marketplace mode
      const mode = getMarketplaceMode()
      nearbyProducts = items.filter(item => {
        if (mode === 'college' && item.marketplace_mode === 'community') return false
        if (mode === 'community' && item.marketplace_mode === 'college') return false
        return true
      })

      // Ensure coordinates for each item
      nearbyProducts.forEach((item, idx) => {
        if (!item.coords) {
          if (item.lat && item.lng) {
            item.coords = [parseFloat(item.lat), parseFloat(item.lng)]
          } else {
            // Realistic dispersion around campus center
            const angle = (idx * 137.5) * (Math.PI / 180)
            const r = 0.002 + (idx * 0.001)
            item.coords = [CAMPUS_COORDS[0] + r * Math.cos(angle), CAMPUS_COORDS[1] + r * Math.sin(angle)]
          }
        }
      })

      plotProductMarkers()
      renderNearbyFeed()
    }

    function plotProductMarkers() {
      if (!productMarkersLayer) return
      productMarkersLayer.clearLayers()

      nearbyProducts.forEach(item => {
        if (item.coords && item.coords.length === 2) {
          L.circleMarker(item.coords, {
            radius: 8,
            fillColor: '#10B981',
            color: '#059669',
            weight: 2,
            opacity: 1,
            fillOpacity: 0.8
          }).addTo(productMarkersLayer).bindPopup(`
            <div class="text-xs">
              <b class="text-gray-900">${item.title}</b><br>
              <span class="text-blue-600 font-bold">₹${item.price}</span><br>
              <span class="text-[10px] text-gray-500">Meeting: ${item.meeting_point || item.pickup_location || 'Campus'}</span><br>
              <a href="product.html?id=${item.id}" class="text-blue-500 underline font-semibold mt-1 inline-block">View Item</a>
            </div>
          `)
        }
      })
    }

    function renderNearbyFeed() {
      const grid = document.getElementById('nearby-products-grid')
      const countEl = document.getElementById('nearby-count')

      if (nearbyProducts.length === 0) {
        countEl.textContent = '0 items found nearby'
        grid.innerHTML = `
          <div class="col-span-full text-center py-16 px-4 bg-white dark:bg-gray-800 rounded-2xl border border-dashed border-gray-200 dark:border-gray-700">
            <span class="text-4xl block mb-2">📍</span>
            <h4 class="text-sm font-bold text-gray-700 dark:text-gray-300">No nearby items listed yet</h4>
            <p class="text-xs text-gray-400 mt-1 max-w-sm mx-auto">Post an item from campus or your locality to see it on the GPS map!</p>
            <a href="add-product.html" class="inline-flex items-center gap-2 mt-4 px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl shadow">
              + Post First Item
            </a>
          </div>
        `
        return
      }

      const itemsWithDist = nearbyProducts.map(item => {
        const d = calculateDistance(userCoords.lat, userCoords.lng, item.coords[0], item.coords[1])
        return { ...item, distanceKm: d }
      })

      let filtered = itemsWithDist
      if (radiusFilter === '5km') {
        filtered = itemsWithDist.filter(i => i.distanceKm <= 5)
      } else if (radiusFilter === 'more') {
        filtered = itemsWithDist.filter(i => i.distanceKm > 5)
      }

      filtered.sort((a, b) => a.distanceKm - b.distanceKm)
      countEl.textContent = `${filtered.length} items found nearby`

      grid.innerHTML = filtered.map(item => {
        const card = createProductCard(item, [])
        return card.replace(
          '<!-- AI Badges -->',
          `<div class="inline-flex items-center gap-1 px-2 py-0.5 mb-1 text-[10px] font-bold rounded bg-emerald-50 dark:bg-emerald-950 text-emerald-600 border border-emerald-200">📍 ${item.distanceKm.toFixed(1)} km away</div>`
        )
      }).join('')
    }

    // Geolocation trigger
    document.getElementById('detect-loc-btn').onclick = () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          userCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude }
          if (map) {
            map.setView([userCoords.lat, userCoords.lng], 15)
            if (userMarker) map.removeLayer(userMarker)
            userMarker = L.marker([userCoords.lat, userCoords.lng]).addTo(map).bindPopup('<b>Your Current Location</b>').openPopup()
          }
          renderNearbyFeed()
        })
      }
    }

    // Radius Filter buttons
    const radAll = document.getElementById('rad-all')
    const rad5 = document.getElementById('rad-5km')
    const radMore = document.getElementById('rad-more')

    function setActiveRad(btn, type) {
      [radAll, rad5, radMore].forEach(b => b.className = 'px-3 py-1.5 rounded-xl text-gray-600 dark:text-gray-300 hover:text-blue-600 transition')
      btn.className = 'px-3 py-1.5 rounded-xl bg-blue-600 text-white shadow-sm transition'
      radiusFilter = type
      renderNearbyFeed()
    }

    radAll.onclick = () => setActiveRad(radAll, 'all')
    rad5.onclick = () => setActiveRad(rad5, '5km')
    radMore.onclick = () => setActiveRad(radMore, 'more')

    initMap()
    loadNearbyProducts()
  </script>
</body>
</html>
