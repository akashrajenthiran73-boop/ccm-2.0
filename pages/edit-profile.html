<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile - CCM 2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
  <nav id="main-navbar"></nav>

  <div class="max-w-2xl mx-auto px-4 py-8">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700 p-6 sm:p-8">
      
      <div class="flex items-center justify-between pb-4 mb-6 border-b border-gray-100 dark:border-gray-700">
        <div>
          <h1 class="text-xl font-black">Edit Profile & Settings</h1>
          <p class="text-xs text-gray-400">Update your college credentials, contact details, and password</p>
        </div>
        <a href="profile.html" class="text-xs font-bold text-blue-600 dark:text-blue-400 hover:underline">← View Profile</a>
      </div>

      <!-- Edit Profile Form -->
      <form id="edit-profile-form" class="space-y-4">
        
        <h3 class="text-xs font-bold uppercase text-blue-600 tracking-wider">Personal & Contact Info</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold mb-1">Full Name *</label>
            <input type="text" id="full-name" required class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">Username *</label>
            <input type="text" id="username" required class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold mb-1">Mobile Number *</label>
            <input type="tel" id="mobile" required class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">Location *</label>
            <input type="text" id="location" required class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold mb-1">Campus / Room Address</label>
          <input type="text" id="address" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <label class="block text-xs font-bold mb-1">Bio / About Me</label>
          <textarea id="bio" rows="2" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500" placeholder="A brief note about what you study or buy/sell..."></textarea>
        </div>

        <h3 class="text-xs font-bold uppercase text-blue-600 tracking-wider pt-4 border-t border-gray-100 dark:border-gray-700">College Credentials</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold mb-1">College Roll / ID No.</label>
            <input type="text" id="college-id" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">College Name</label>
            <input type="text" id="college-name" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold mb-1">Department</label>
            <input type="text" id="department" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">Course</label>
            <input type="text" id="course" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold mb-1">Year</label>
            <select id="year" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm">
              <option value="1st Year">1st Year</option>
              <option value="2nd Year">2nd Year</option>
              <option value="3rd Year">3rd Year</option>
              <option value="4th Year">4th Year</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">Semester</label>
            <select id="semester" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm">
              <option value="Sem 1">Sem 1</option>
              <option value="Sem 2">Sem 2</option>
              <option value="Sem 3">Sem 3</option>
              <option value="Sem 4">Sem 4</option>
              <option value="Sem 5">Sem 5</option>
              <option value="Sem 6">Sem 6</option>
              <option value="Sem 7">Sem 7</option>
              <option value="Sem 8">Sem 8</option>
            </select>
          </div>
        </div>

        <div id="save-msg" class="text-xs font-semibold text-center hidden p-2.5 rounded-lg"></div>

        <button type="submit" id="save-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow">
          Save Profile Changes
        </button>
      </form>

      <!-- Change Password Section -->
      <div id="password" class="mt-8 pt-6 border-t border-gray-200 dark:border-gray-700">
        <h3 class="text-xs font-bold uppercase text-red-600 tracking-wider mb-3">Change Password</h3>
        
        <form id="change-password-form" class="space-y-3">
          <div>
            <label class="block text-xs font-bold mb-1">New Password (min 6 chars)</label>
            <input type="password" id="new-password" required minlength="6" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">Confirm New Password</label>
            <input type="password" id="confirm-password" required minlength="6" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
          </div>

          <div id="pwd-msg" class="text-xs font-semibold text-center hidden p-2.5 rounded-lg"></div>

          <button type="submit" id="pwd-btn" class="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-2.5 rounded-xl text-xs transition">
            Update Password
          </button>
        </form>
      </div>

    </div>
  </div>

  <script type="module" src="../js/theme.js"></script>
  <script type="module" src="../js/i18n.js"></script>
  <script type="module" src="../js/mode.js"></script>
  <script type="module" src="../js/navbar.js"></script>
  <script type="module">
    import { supabase, getCurrentUser, getUserProfile } from '../js/supabase.js'

    let currentUser = null

    async function init() {
      currentUser = await getCurrentUser()
      if (!currentUser) {
        window.location.href = 'login.html'
        return
      }

      const p = await getUserProfile(currentUser.id)
      if (p) {
        document.getElementById('full-name').value = p.full_name || p.name || ''
        document.getElementById('username').value = p.username || ''
        document.getElementById('mobile').value = p.mobile_number || p.phone || ''
        document.getElementById('location').value = p.location || ''
        document.getElementById('address').value = p.address || ''
        document.getElementById('bio').value = p.bio || ''
        document.getElementById('college-id').value = p.college_id_number || ''
        document.getElementById('college-name').value = p.college_name || ''
        document.getElementById('department').value = p.department || ''
        document.getElementById('course').value = p.course || ''
        if (p.year) document.getElementById('year').value = p.year
        if (p.semester) document.getElementById('semester').value = p.semester
      }
    }

    // Save Profile Form
    document.getElementById('edit-profile-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const saveBtn = document.getElementById('save-btn')
      const saveMsg = document.getElementById('save-msg')
      saveBtn.disabled = true
      saveBtn.textContent = 'Saving...'
      saveMsg.classList.add('hidden')

      const updates = {
        id: currentUser.id,
        name: document.getElementById('full-name').value.trim(),
        full_name: document.getElementById('full-name').value.trim(),
        username: document.getElementById('username').value.trim(),
        mobile_number: document.getElementById('mobile').value.trim(),
        phone: document.getElementById('mobile').value.trim(),
        location: document.getElementById('location').value.trim(),
        address: document.getElementById('address').value.trim(),
        bio: document.getElementById('bio').value.trim(),
        college_id_number: document.getElementById('college-id').value.trim(),
        college_name: document.getElementById('college-name').value.trim(),
        department: document.getElementById('department').value.trim(),
        course: document.getElementById('course').value.trim(),
        year: document.getElementById('year').value,
        semester: document.getElementById('semester').value,
        updated_at: new Date().toISOString()
      }

      try {
        await supabase.from('profiles').upsert(updates)
        localStorage.setItem(`ccm_profile_${currentUser.id}`, JSON.stringify(updates))

        saveMsg.className = 'text-xs font-semibold text-center p-2.5 rounded-lg bg-green-50 text-green-700 border border-green-200 block'
        saveMsg.textContent = 'Profile changes saved successfully! ✓'
        saveBtn.disabled = false
        saveBtn.textContent = 'Save Profile Changes'

        setTimeout(() => {
          window.location.href = 'profile.html'
        }, 1200)
      } catch (err) {
        saveMsg.className = 'text-xs font-semibold text-center p-2.5 rounded-lg bg-red-50 text-red-700 border border-red-200 block'
        saveMsg.textContent = err.message || 'Failed to save changes'
        saveBtn.disabled = false
        saveBtn.textContent = 'Save Profile Changes'
      }
    })

    // Change Password Form
    document.getElementById('change-password-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const pwd = document.getElementById('new-password').value
      const confirm = document.getElementById('confirm-password').value
      const pwdMsg = document.getElementById('pwd-msg')
      const pwdBtn = document.getElementById('pwd-btn')

      if (pwd !== confirm) {
        pwdMsg.className = 'text-xs font-semibold text-center p-2.5 rounded-lg bg-red-50 text-red-700 border border-red-200 block'
        pwdMsg.textContent = 'Passwords do not match!'
        return
      }

      pwdBtn.disabled = true
      pwdBtn.textContent = 'Updating...'

      try {
        const { error } = await supabase.auth.updateUser({ password: pwd })
        if (error) throw error

        pwdMsg.className = 'text-xs font-semibold text-center p-2.5 rounded-lg bg-green-50 text-green-700 border border-green-200 block'
        pwdMsg.textContent = 'Password updated successfully! ✓'
        pwdBtn.disabled = false
        pwdBtn.textContent = 'Update Password'
      } catch (err) {
        pwdMsg.className = 'text-xs font-semibold text-center p-2.5 rounded-lg bg-red-50 text-red-700 border border-red-200 block'
        pwdMsg.textContent = err.message || 'Failed to update password'
        pwdBtn.disabled = false
        pwdBtn.textContent = 'Update Password'
      }
    })

    init()
  </script>
</body>
</html>
