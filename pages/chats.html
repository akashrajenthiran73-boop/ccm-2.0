<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Chats - CCM 2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
  <nav id="main-navbar"></nav>

  <div class="max-w-4xl mx-auto px-4 sm:px-6 py-8">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-black flex items-center gap-2">
          <span>💬</span> Messages & Negotiations
        </h1>
        <p class="text-xs text-gray-400 mt-1">Direct buyer ↔ seller campus conversations</p>
      </div>
    </div>

    <!-- Chat Threads List -->
    <div id="chat-list" class="space-y-3">
      <div class="text-center py-16 text-gray-400 text-xs animate-pulse">Loading conversations...</div>
    </div>
  </div>

  <script type="module" src="../js/theme.js"></script>
  <script type="module" src="../js/i18n.js"></script>
  <script type="module" src="../js/mode.js"></script>
  <script type="module" src="../js/navbar.js"></script>
  <script type="module">
    import { supabase, getCurrentUser } from '../js/supabase.js'

    const chatList = document.getElementById('chat-list')

    async function loadConversations() {
      const user = await getCurrentUser()
      if (!user) {
        alert('Please login to view chats')
        window.location.href = 'login.html'
        return
      }

      let convos = []
      try {
        const { data, error } = await supabase
          .from('conversations')
          .select('*, products(id, title, price, photos), messages(content, created_at, sender_id, is_read)')
          .or(`buyer_id.eq.${user.id},seller_id.eq.${user.id}`)
          .order('created_at', { ascending: false })

        if (!error && data) convos = data
      } catch (e) {}

      // Fallback merge
      const local = JSON.parse(localStorage.getItem('ccm_fallback_conversations') || '[]')
      const userLocal = local.filter(c => c.buyer_id === user.id || c.seller_id === user.id)

      const map = new Map()
      convos.forEach(c => map.set(c.id, c))
      userLocal.forEach(c => {
        if (!map.has(c.id)) map.set(c.id, c)
      })

      convos = Array.from(map.values()).sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0))

      if (convos.length === 0) {
        chatList.innerHTML = `
          <div class="text-center py-16 px-4 bg-white dark:bg-gray-800 rounded-2xl border border-dashed border-gray-200 dark:border-gray-700">
            <span class="text-4xl block mb-2">💬</span>
            <h4 class="text-sm font-bold text-gray-700 dark:text-gray-300">No conversations yet</h4>
            <p class="text-xs text-gray-400 mt-1 max-w-sm mx-auto">Open any product listing in the marketplace and tap "Chat" to message the seller directly!</p>
            <a href="../index.html" class="inline-block mt-4 px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl shadow">
              Explore Listings
            </a>
          </div>
        `
        return
      }

      chatList.innerHTML = convos.map(chat => {
        const isSeller = chat.seller_id === user.id
        const otherPartyName = isSeller ? (chat.buyer_name || 'Buyer') : (chat.seller_name || 'Seller')
        const msgs = chat.messages || []
        const lastMsg = msgs[msgs.length - 1]?.content || 'Tap to open chat...'
        const unreadCount = msgs.filter(m => m.sender_id !== user.id && !m.is_read).length

        return `
          <a href="chat.html?product=${chat.product_id || chat.products?.id}&seller=${chat.seller_id}&conv=${chat.id}"
             class="block bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm hover-lift transition">
            <div class="flex items-center gap-3.5">
              <img src="${chat.products?.photos?.[0] || 'https://via.placeholder.com/60'}" class="w-14 h-14 object-cover rounded-xl border border-gray-200">
              
              <div class="flex-1 min-w-0">
                <div class="flex justify-between items-center">
                  <h4 class="font-bold text-sm text-gray-900 dark:text-white truncate">${otherPartyName}</h4>
                  <span class="font-black text-blue-600 dark:text-blue-400 text-xs">₹${chat.products?.price || 0}</span>
                </div>
                <div class="text-xs text-gray-500 truncate">${chat.products?.title || 'Campus Item'}</div>
                <div class="flex justify-between items-center mt-1">
                  <p class="text-xs ${unreadCount > 0 ? 'font-bold text-gray-900 dark:text-white' : 'text-gray-400'} truncate">
                    ${lastMsg}
                  </p>
                  ${unreadCount > 0 ? `<span class="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">${unreadCount}</span>` : ''}
                </div>
              </div>

            </div>
          </a>
        `
      }).join('')
    }

    loadConversations()
  </script>
</body>
</html>
