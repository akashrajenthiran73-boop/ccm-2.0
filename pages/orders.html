<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders & Tracking - CCM 2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
  <nav id="main-navbar"></nav>

  <div class="max-w-5xl mx-auto px-4 sm:px-6 py-8">
    
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-black flex items-center gap-2">
          <span>📦</span> My Orders & Handover Tracking
        </h1>
        <p class="text-xs text-gray-400 mt-1">
          Track campus orders from confirmation through safe meeting pickup
        </p>
      </div>
      
      <!-- Bought / Sold Tabs -->
      <div class="flex items-center bg-gray-200 dark:bg-gray-800 p-1 rounded-xl text-xs font-bold">
        <button id="tab-bought" class="px-4 py-2 rounded-lg bg-blue-600 text-white shadow transition">
          🛒 Bought Items
        </button>
        <button id="tab-sold" class="px-4 py-2 rounded-lg text-gray-600 dark:text-gray-300 hover:text-blue-600 transition">
          🏷️ Sold Items
        </button>
      </div>
    </div>

    <!-- Orders Feed Container -->
    <div id="orders-container" class="space-y-4">
      <div class="text-center py-16 text-gray-400 text-xs animate-pulse">Loading orders...</div>
    </div>

  </div>

  <!-- Review Modal -->
  <div id="review-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-gray-100 dark:border-gray-700">
      <h3 class="text-base font-black mb-1">⭐ Leave a Review</h3>
      <p class="text-xs text-gray-400 mb-4">Rate the seller and item condition.</p>
      
      <div class="mb-4">
        <label class="block text-xs font-bold mb-1">Rating (1 to 5 Stars)</label>
        <select id="review-stars" class="w-full px-3 py-2 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-xs font-bold">
          <option value="5">⭐⭐⭐⭐⭐ Excellent (5/5)</option>
          <option value="4">⭐⭐⭐⭐ Good (4/5)</option>
          <option value="3">⭐⭐⭐ Average (3/5)</option>
          <option value="2">⭐⭐ Fair (2/5)</option>
          <option value="1">⭐ Poor (1/5)</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="block text-xs font-bold mb-1">Feedback Comments</label>
        <textarea id="review-text" rows="3" placeholder="Punctual meeting, good product condition..."
                  class="w-full px-3 py-2 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-xs"></textarea>
      </div>

      <div class="flex gap-2">
        <button id="close-review-btn" class="flex-1 py-2.5 bg-gray-100 dark:bg-gray-700 text-xs font-bold rounded-xl hover:bg-gray-200">
          Cancel
        </button>
        <button id="submit-review-btn" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow">
          Submit Review
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="../js/theme.js"></script>
  <script type="module" src="../js/i18n.js"></script>
  <script type="module" src="../js/mode.js"></script>
  <script type="module" src="../js/navbar.js"></script>
  <script type="module">
    import { supabase, getCurrentUser } from '../js/supabase.js'
    import { processSimulatedRefund } from '../js/wallet.js'

    let currentUser = null
    let activeTab = 'bought'
    let selectedOrderForReview = null

    // Order tracking steps
    const STEPS = ['placed', 'confirmed', 'ready_for_pickup', 'completed']

    async function initOrdersPage() {
      currentUser = await getCurrentUser()
      if (!currentUser) {
        alert('Please sign in to view your orders')
        window.location.href = 'login.html'
        return
      }
      loadOrders()
    }

    async function loadOrders() {
      const container = document.getElementById('orders-container')
      container.innerHTML = '<div class="text-center py-16 text-gray-400 text-xs animate-pulse">Loading orders...</div>'

      let orders = []
      try {
        const queryField = activeTab === 'bought' ? 'buyer_id' : 'seller_id'
        const { data, error } = await supabase
          .from('orders')
          .select('*, products(id, title, price, photos, pickup_location)')
          .eq(queryField, currentUser.id)
          .order('created_at', { ascending: false })

        if (!error && data) orders = data
      } catch (e) {}

      // Fallback
      if (orders.length === 0) {
        const local = JSON.parse(localStorage.getItem('ccm_fallback_orders') || '[]')
        orders = local.filter(o => activeTab === 'bought' ? o.buyer_id === currentUser.id : o.seller_id === currentUser.id)
      }

      if (orders.length === 0) {
        container.innerHTML = `
          <div class="bg-white dark:bg-gray-800 rounded-2xl p-12 text-center border border-gray-200 dark:border-gray-700">
            <span class="text-4xl block mb-2">📦</span>
            <p class="font-bold text-sm">No ${activeTab === 'bought' ? 'bought' : 'sold'} orders found.</p>
            <p class="text-xs text-gray-400 mt-1 mb-4">Your purchases and campus pickups will appear here.</p>
            <a href="../index.html" class="inline-block px-4 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl shadow">Explore Marketplace</a>
          </div>
        `
        return
      }

      container.innerHTML = orders.map(order => {
        const currentStepIdx = STEPS.indexOf(order.status) >= 0 ? STEPS.indexOf(order.status) : 1
        const isCancelled = order.status === 'cancelled'

        return `
          <div class="bg-white dark:bg-gray-800 rounded-2xl p-5 border border-gray-200 dark:border-gray-700 shadow-sm space-y-4">
            
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 border-b border-gray-100 dark:border-gray-700 text-xs">
              <div>
                <span class="font-mono text-gray-400">Order #${order.id.slice(0, 10)}</span>
                <span class="text-gray-400 ml-2">• ${new Date(order.created_at).toLocaleDateString('en-IN')}</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="px-2.5 py-1 rounded-full font-bold text-[10px] ${
                  order.status === 'completed' ? 'bg-green-100 text-green-700' :
                  order.status === 'cancelled' ? 'bg-red-100 text-red-700' :
                  'bg-blue-100 text-blue-700'
                }">
                  ${order.status?.toUpperCase()}
                </span>
                <span class="text-gray-400 font-medium">Payment: ${order.payment_method?.toUpperCase()}</span>
              </div>
            </div>

            <!-- Item & Price -->
            <div class="flex items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                <img src="${order.products?.photos?.[0] || 'https://via.placeholder.com/80'}" class="w-14 h-14 object-cover rounded-xl border border-gray-200">
                <div>
                  <h4 class="font-bold text-sm text-gray-900 dark:text-white">${order.products?.title || 'Campus Item'}</h4>
                  <p class="text-xs text-gray-400 mt-0.5">📍 Handover Spot: <b class="text-gray-700 dark:text-gray-300">${order.pickup_location || 'Campus Main Gate'}</b></p>
                </div>
              </div>
              <div class="text-right">
                <div class="text-lg font-black text-blue-600 dark:text-blue-400">₹${order.total_price}</div>
                <div class="text-[10px] text-gray-400">Qty: ${order.quantity || 1}</div>
              </div>
            </div>

            <!-- Visual Order Tracking Bar -->
            ${!isCancelled ? `
              <div class="pt-2">
                <div class="text-[11px] font-bold text-gray-400 uppercase tracking-wider mb-2">Order Tracking</div>
                <div class="grid grid-cols-4 gap-2 text-center text-[10px] font-bold">
                  <div class="${currentStepIdx >= 0 ? 'text-blue-600' : 'text-gray-400'}">
                    <div class="h-1.5 rounded-full ${currentStepIdx >= 0 ? 'bg-blue-600' : 'bg-gray-200 dark:bg-gray-700'} mb-1"></div>
                    1. Placed
                  </div>
                  <div class="${currentStepIdx >= 1 ? 'text-blue-600' : 'text-gray-400'}">
                    <div class="h-1.5 rounded-full ${currentStepIdx >= 1 ? 'bg-blue-600' : 'bg-gray-200 dark:bg-gray-700'} mb-1"></div>
                    2. Confirmed
                  </div>
                  <div class="${currentStepIdx >= 2 ? 'text-blue-600' : 'text-gray-400'}">
                    <div class="h-1.5 rounded-full ${currentStepIdx >= 2 ? 'bg-blue-600' : 'bg-gray-200 dark:bg-gray-700'} mb-1"></div>
                    3. Ready Pickup
                  </div>
                  <div class="${currentStepIdx >= 3 ? 'text-green-600' : 'text-gray-400'}">
                    <div class="h-1.5 rounded-full ${currentStepIdx >= 3 ? 'bg-green-600' : 'bg-gray-200 dark:bg-gray-700'} mb-1"></div>
                    4. Completed
                  </div>
                </div>
              </div>
            ` : `
              <div class="p-2.5 bg-red-50 dark:bg-red-950/30 text-red-700 dark:text-red-300 rounded-xl text-xs font-semibold">
                ❌ This order was cancelled. Simulated payment amount refunded to wallet.
              </div>
            `}

            <!-- Actions Row -->
            <div class="flex items-center justify-end gap-2 pt-2 border-t border-gray-100 dark:border-gray-700 text-xs font-bold">
              ${!isCancelled && order.status !== 'completed' ? `
                ${activeTab === 'sold' ? `
                  <button onclick="updateOrderStatus('${order.id}', 'ready_for_pickup')" class="px-3 py-1.5 bg-amber-100 text-amber-800 rounded-lg hover:bg-amber-200">
                    Mark Ready for Pickup
                  </button>
                  <button onclick="updateOrderStatus('${order.id}', 'completed')" class="px-3 py-1.5 bg-green-600 text-white rounded-lg hover:bg-green-700">
                    Mark Completed
                  </button>
                ` : `
                  <button onclick="updateOrderStatus('${order.id}', 'completed')" class="px-3 py-1.5 bg-green-600 text-white rounded-lg hover:bg-green-700">
                    Confirm Item Received
                  </button>
                  <button onclick="cancelOrder('${order.id}', ${order.total_price})" class="px-3 py-1.5 bg-gray-100 dark:bg-gray-700 text-red-600 rounded-lg hover:bg-red-50">
                    Cancel Order
                  </button>
                `}
              ` : ''}

              ${order.status === 'completed' && activeTab === 'bought' ? `
                <button onclick="openReviewModal('${order.id}', '${order.product_id}', '${order.seller_id}')" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-lg flex items-center gap-1">
                  <span>⭐</span> Rate & Review
                </button>
              ` : ''}
            </div>

          </div>
        `
      }).join('')
    }

    // Tabs switch
    document.getElementById('tab-bought').onclick = () => {
      activeTab = 'bought'
      document.getElementById('tab-bought').className = 'px-4 py-2 rounded-lg bg-blue-600 text-white shadow transition'
      document.getElementById('tab-sold').className = 'px-4 py-2 rounded-lg text-gray-600 dark:text-gray-300 hover:text-blue-600 transition'
      loadOrders()
    }
    document.getElementById('tab-sold').onclick = () => {
      activeTab = 'sold'
      document.getElementById('tab-sold').className = 'px-4 py-2 rounded-lg bg-blue-600 text-white shadow transition'
      document.getElementById('tab-bought').className = 'px-4 py-2 rounded-lg text-gray-600 dark:text-gray-300 hover:text-blue-600 transition'
      loadOrders()
    }

    // Status update
    window.updateOrderStatus = async (orderId, newStatus) => {
      try {
        await supabase.from('orders').update({ status: newStatus }).eq('id', orderId)
      } catch (e) {}
      loadOrders()
    }

    // Cancel order
    window.cancelOrder = async (orderId, price) => {
      if (!confirm('Cancel this order? Refund will be credited directly to your Digital Wallet.')) return
      try {
        await supabase.from('orders').update({ status: 'cancelled', payment_status: 'refunded' }).eq('id', orderId)
        await processSimulatedRefund(orderId, price, currentUser.id)
        alert('Order cancelled. ₹' + price + ' refunded to your Digital Wallet!')
      } catch (e) {}
      loadOrders()
    }

    // Review Modal
    window.openReviewModal = (orderId, productId, sellerId) => {
      selectedOrderForReview = { orderId, productId, sellerId }
      document.getElementById('review-modal').classList.remove('hidden')
    }

    document.getElementById('close-review-btn').onclick = () => {
      document.getElementById('review-modal').classList.add('hidden')
    }

    document.getElementById('submit-review-btn').onclick = async () => {
      if (!selectedOrderForReview) return
      const rating = parseInt(document.getElementById('review-stars').value)
      const text = document.getElementById('review-text').value.trim()

      try {
        await supabase.from('reviews').insert({
          product_id: selectedOrderForReview.productId,
          seller_id: selectedOrderForReview.sellerId,
          buyer_id: currentUser.id,
          rating: rating,
          review_text: text
        })
        alert('Thank you! Review submitted successfully ⭐')
      } catch (e) {
        alert('Review saved!')
      }
      document.getElementById('review-modal').classList.add('hidden')
    }

    initOrdersPage()
  </script>
</body>
</html>
