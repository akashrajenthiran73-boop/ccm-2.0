<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - CCM 2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <!-- Theme Animations CSS -->
<link rel="stylesheet" href="../css/theme-animations.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
  <!-- Navbar - CORRECT LINKS -->
  <nav class="bmw-navbar bg-white dark:bg-gray-800 shadow-md p-4 sticky top-0 z-40 transition-colors animate-fade-down">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="../index.html" class="text-2xl font-bold text-blue-600 dark:text-blue-400 bmw-hover px-3 py-1 rounded-lg">CCM 2.0</a>
      <div id="nav-links" class="flex gap-4 items-center">
        <!-- JS la fill aagum -->
      </div>
    </div>
  </nav>

  <!-- Tabs -->
  <div class="max-w-6xl mx-auto p-4 page-transition">
    <h1 class="text-2xl font-bold mb-6 text-gray-900 dark:text-white animate-fade-up">My Orders</h1>
    
    <div class="flex gap-4 mb-6 border-b dark:border-gray-700">
      <button id="tab-bought" onclick="switchTab('bought')" 
              class="pb-3 px-2 border-b-2 border-blue-600 text-blue-600 dark:text-blue-400 font-semibold bmw-hover">
        Bought
      </button>
      <button id="tab-sold" onclick="switchTab('sold')" 
              class="pb-3 px-2 border-b-2 border-transparent text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 bmw-hover">
        Sold
      </button>
    </div>

    <!-- Orders List -->
    <div id="orders-list" class="space-y-4">
      <div class="text-center text-gray-400 dark:text-gray-500 py-20 animate-pulse">Loading orders...</div>
    </div>
  </div>

  <!-- Global Theme Button - INLINE -->
  <script>
    const html = document.documentElement
    const THEME_KEY = 'ccm-theme'
    
    function applyTheme() {
      const saved = localStorage.getItem(THEME_KEY)
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        html.classList.add('dark')
      } else {
        html.classList.remove('dark')
      }
    }
    
    function toggleTheme() {
      html.classList.toggle('dark')
      const isDark = html.classList.contains('dark')
      localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light')
      window.dispatchEvent(new CustomEvent('themeChanged', { detail: { isDark } }))
      return isDark ? '☀️' : '🌙'
    }
    
    function getThemeIcon() {
      return html.classList.contains('dark') ? '☀️' : '🌙'
    }
    
    applyTheme()
    
    const btn = document.createElement('button')
    btn.id = 'global-theme-toggle'
    btn.className = 'fixed bottom-6 right-6 z-50 text-2xl p-4 rounded-full bg-white dark:bg-gray-800 shadow-2xl hover:scale-110 active:scale-95 transition-all border-2 border-gray-200 dark:border-gray-700 transformer-btn'
    btn.textContent = getThemeIcon()
    btn.title = 'Toggle Theme'
    btn.onclick = () => {
      btn.textContent = toggleTheme()
    }
    
    window.addEventListener('themeChanged', (e) => {
      btn.textContent = e.detail.isDark ? '☀️' : '🌙'
    })
    
    document.body.appendChild(btn)
  </script>

  <script type="module">
    import { supabase } from '../js/supabase.js'

    let currentUser = null
    let currentTab = 'bought'

    async function init() {
      const { data: { user } } = await supabase.auth.getUser()
      if (!user) {
        window.location.href = 'login.html'
        return
      }
      currentUser = user
      updateNavbar()
      loadOrders()
    }

    // Navbar - CORRECT LINKS DA
    function updateNavbar() {
      const navLinks = document.getElementById('nav-links')
      navLinks.innerHTML = `
        <a href="wishlist.html" class="text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 bmw-hover">❤️ Wishlist</a>
        <a href="orders.html" class="text-blue-600 dark:text-blue-400 font-medium bmw-hover">📦 Orders</a>
        <a href="chats.html" class="text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 bmw-hover">My Chats</a>
        <a href="profile.html" class="text-gray-700 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 bmw-hover">Profile</a>
        <a href="add-product.html" class="transformer-btn bmw-hover bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">+ Sell</a>
      `
    }

    function switchTab(tab) {
      currentTab = tab
      
      // Update tab buttons
      document.getElementById('tab-bought').className = tab === 'bought' 
        ? 'pb-3 px-2 border-b-2 border-blue-600 text-blue-600 dark:text-blue-400 font-semibold bmw-hover'
        : 'pb-3 px-2 border-b-2 border-transparent text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 bmw-hover'
      
      document.getElementById('tab-sold').className = tab === 'sold'
        ? 'pb-3 px-2 border-b-2 border-blue-600 text-blue-600 dark:text-blue-400 font-semibold bmw-hover'
        : 'pb-3 px-2 border-b-2 border-transparent text-gray-500 dark:text-gray-400 hover:text-blue-600 dark:hover:text-blue-400 bmw-hover'
      
      loadOrders()
    }

    window.switchTab = switchTab

    async function loadOrders() {
      const list = document.getElementById('orders-list')
      list.innerHTML = '<div class="text-center text-gray-400 dark:text-gray-500 py-20 animate-pulse">Loading...</div>'

      const field = currentTab === 'bought' ? 'buyer_id' : 'seller_id'
      
      const { data: orders, error } = await supabase
        .from('orders')
        .select(`
          *,
          products (*),
          buyer:buyer_id (name, email),
          seller:seller_id (name, email)
        `)
        .eq(field, currentUser.id)
        .order('created_at', { ascending: false })

      if (error) {
        list.innerHTML = `<div class="text-center text-red-500 dark:text-red-400 py-20 animate-shake">Error: ${error.message}</div>`
        return
      }

      if (!orders || orders.length === 0) {
        list.innerHTML = `
          <div class="text-center py-20 animate-fade-in">
            <div class="text-6xl mb-4">📦</div>
            <p class="text-gray-400 dark:text-gray-500 text-lg mb-4">No ${currentTab} orders yet da</p>
            <a href="../index.html" class="transformer-btn bmw-hover bg-blue-600 text-white px-6 py-2 rounded-lg inline-block hover:bg-blue-700">Browse Products</a>
          </div>
        `
        return
      }

      list.innerHTML = orders.map((order, index) => createOrderCard(order, index)).join('')
    }

    function createOrderCard(order, index) {
      const product = order.products
      const otherUser = currentTab === 'bought' ? order.seller : order.buyer
      const date = new Date(order.created_at).toLocaleDateString('en-IN', {
        day: 'numeric',
        month: 'short',
        year: 'numeric'
      })

      const statusColors = {
        pending: 'bg-yellow-100 dark:bg-yellow-900/30 text-yellow-800 dark:text-yellow-300',
        completed: 'bg-green-100 dark:bg-green-900/30 text-green-800 dark:text-green-300',
        cancelled: 'bg-red-100 dark:bg-red-900/30 text-red-800 dark:text-red-300'
      }

      return `
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 hover-lift animate-scale-in transition-colors" style="animation-delay: ${index * 0.05}s">
          <div class="flex gap-4">
            <img src="${product?.photos?.[0] || 'https://via.placeholder.com/150'}" 
                 class="w-24 h-24 object-cover rounded-lg hover-scale">
            
            <div class="flex-1">
              <div class="flex justify-between items-start mb-2">
                <div>
                  <h3 class="font-bold text-lg text-gray-900 dark:text-white">${product?.title || 'Product deleted'}</h3>
                  <p class="text-2xl font-bold text-blue-600 dark:text-blue-400 mt-1">₹${order.price}</p>
                </div>
                <span class="text-xs px-3 py-1 rounded-full ${statusColors[order.status] || 'bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300'}">
                  ${order.status}
                </span>
              </div>

              <div class="grid grid-cols-2 gap-4 text-sm mb-3">
                <div>
                  <span class="text-gray-500 dark:text-gray-400">${currentTab === 'bought' ? 'Seller' : 'Buyer'}:</span>
                  <p class="font-medium text-gray-900 dark:text-white">${otherUser?.name || 'Unknown'}</p>
                </div>
                <div>
                  <span class="text-gray-500 dark:text-gray-400">Order Date:</span>
                  <p class="font-medium text-gray-900 dark:text-white">${date}</p>
                </div>
              </div>

              <div class="flex gap-2">
                <a href="product.html?id=${product?.id}" 
                   class="text-blue-600 dark:text-blue-400 hover:underline text-sm bmw-hover">
                  View Product →
                </a>
                <button onclick="openChat('${product?.id}', '${currentTab === 'bought' ? order.seller_id : order.buyer_id}')"
                        class="transformer-btn text-blue-600 dark:text-blue-400 hover:underline text-sm">
                  💬 Chat
                </button>
              </div>
            </div>
          </div>
        </div>
      `
    }

    window.openChat = (productId, userId) => {
      window.location.href = `chat.html?product=${productId}&seller=${userId}`
    }

    init()
  </script>
  <!-- Theme Effects JS -->
<script type="module" src="../js/theme-effects.js"></script>
</body>
</html>
