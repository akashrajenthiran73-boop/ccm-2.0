<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post an Item - CCM 2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
  <nav id="main-navbar"></nav>

  <div class="max-w-2xl mx-auto px-4 py-8">
    <div class="bg-white dark:bg-gray-800 rounded-2xl p-6 sm:p-8 shadow-sm border border-gray-200 dark:border-gray-700">
      
      <div class="mb-6 pb-4 border-b border-gray-100 dark:border-gray-700">
        <h1 class="text-2xl font-black text-blue-600 dark:text-blue-400">Post an Item for Sale / Barter</h1>
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">List your item in College or Community Marketplace</p>
      </div>

      <form id="add-product-form" class="space-y-5">
        
        <!-- Marketplace Mode Choice -->
        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 dark:text-gray-300 mb-2">
            Marketplace Type *
          </label>
          <div class="grid grid-cols-3 gap-2 text-xs font-bold">
            <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700">
              <input type="radio" name="marketplace_mode" value="college" checked class="text-blue-600">
              <span>🎓 College Only</span>
            </label>
            <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700">
              <input type="radio" name="marketplace_mode" value="community" class="text-emerald-600">
              <span>🌐 Community Only</span>
            </label>
            <label class="flex items-center gap-2 p-3 border rounded-xl cursor-pointer hover:bg-gray-50 dark:hover:bg-gray-700">
              <input type="radio" name="marketplace_mode" value="both" class="text-indigo-600">
              <span>✨ Both Modes</span>
            </label>
          </div>
        </div>

        <!-- Photos Upload & Preview -->
        <div>
          <label class="block text-xs font-bold mb-1">Product Images (Up to 4) *</label>
          <input type="file" id="photos" accept="image/*" multiple
                 class="block w-full text-xs text-gray-500 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 dark:file:bg-blue-900/50 dark:file:text-blue-300 hover:file:bg-blue-100">
          <div id="photo-preview" class="grid grid-cols-4 gap-2 mt-3"></div>
        </div>

        <!-- Title -->
        <div>
          <label class="block text-xs font-bold mb-1">Product Title *</label>
          <input type="text" id="title" required placeholder="e.g. Engineering Mathematics Kreyszig (10th Ed)"
                 class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
        </div>

        <!-- Category & Condition -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold mb-1">Category *</label>
            <select id="category" required class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
              <option value="Books & Notes">📚 Books & Notes</option>
              <option value="Cycles & Vehicles">🚲 Cycles & Vehicles</option>
              <option value="Electronics & Laptops">💻 Electronics & Laptops</option>
              <option value="Lab & Study Equipment">🔬 Lab & Study Equipment</option>
              <option value="Hostel & Room Essentials">🛏️ Hostel & Room Essentials</option>
              <option value="Mobile & Accessories">📱 Mobile & Accessories</option>
              <option value="Sports & Fitness">⚽ Sports & Fitness</option>
              <option value="Other">📦 Other Items</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">Condition *</label>
            <select id="condition" required class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
              <option value="New">New (Unopened / Mint)</option>
              <option value="Like new" selected>Like New (Used gently)</option>
              <option value="Used">Used (Good working condition)</option>
            </select>
          </div>
        </div>

        <!-- Price & AI Suggestion -->
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-bold">Price (₹) *</label>
            <span id="ai-price-tip" class="text-[11px] text-blue-600 dark:text-blue-400 font-semibold cursor-pointer">
              🤖 AI Price Suggestion
            </span>
          </div>
          <input type="number" id="price" required min="1" placeholder="e.g. 450"
                 class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
          <div id="ai-price-box" class="hidden text-xs p-2.5 mt-2 bg-blue-50 dark:bg-blue-950/40 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-800 rounded-lg"></div>
        </div>

        <!-- Meeting Point / Campus Pickup Location -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold mb-1">Campus Meeting Point *</label>
            <select id="meeting-point" class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
              <option value="Main Gate">🚪 Campus Main Gate</option>
              <option value="Central Library">📚 Central Library Front</option>
              <option value="Campus Canteen">☕ Canteen / Food Court</option>
              <option value="Hostel Gate">🏢 Hostel Gate</option>
              <option value="Department Office">🏛️ Department Office</option>
              <option value="Custom Spot">📍 Custom Spot (Specify below)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">Specific Location / GPS</label>
            <div class="flex gap-2">
              <input type="text" id="location-text" placeholder="e.g. Near ATM or Block 2"
                     class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
              <button type="button" id="get-gps-btn" class="px-3 bg-gray-200 dark:bg-gray-700 rounded-xl text-xs font-bold hover:bg-gray-300" title="Use GPS">
                📍
              </button>
            </div>
          </div>
        </div>

        <!-- Description -->
        <div>
          <label class="block text-xs font-bold mb-1">Item Description</label>
          <textarea id="description" rows="3" placeholder="Mention item condition, semester, included accessories, reason for selling..."
                    class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500"></textarea>
        </div>

        <div id="error-msg" class="text-xs text-red-500 font-semibold text-center hidden"></div>

        <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow-md">
          🚀 Post Listing to Marketplace
        </button>

      </form>

    </div>
  </div>

  <script type="module" src="../js/theme.js"></script>
  <script type="module" src="../js/i18n.js"></script>
  <script type="module" src="../js/mode.js"></script>
  <script type="module" src="../js/navbar.js"></script>
  <script type="module">
    import { supabase, getCurrentUser } from '../js/supabase.js'
    import { suggestSmartPrice } from '../js/ai-smart.js'

    let currentUser = null
    let photoFiles = []
    let userCoords = null

    async function checkAuth() {
      currentUser = await getCurrentUser()
      if (!currentUser) {
        alert('Please login to list items for sale')
        window.location.href = 'login.html'
      }
    }
    checkAuth()

    // Photo Preview
    const photoInput = document.getElementById('photos')
    const photoPreview = document.getElementById('photo-preview')
    photoInput.addEventListener('change', () => {
      photoFiles = Array.from(photoInput.files).slice(0, 4)
      photoPreview.innerHTML = ''
      photoFiles.forEach(file => {
        const img = document.createElement('img')
        img.src = URL.createObjectURL(file)
        img.className = 'w-full h-20 object-cover rounded-xl border border-gray-200 dark:border-gray-700'
        photoPreview.appendChild(img)
      })
    })

    // AI Price Suggestion
    const categorySelect = document.getElementById('category')
    const conditionSelect = document.getElementById('condition')
    const aiPriceTip = document.getElementById('ai-price-tip')
    const aiPriceBox = document.getElementById('ai-price-box')

    function updateAiPrice() {
      const cat = categorySelect.value
      const cond = conditionSelect.value
      const suggestion = suggestSmartPrice(cat, cond)
      aiPriceBox.textContent = `🤖 AI Suggestion for ${cat} (${cond}): Recommended fair price is ${suggestion.text}`
      aiPriceBox.classList.remove('hidden')
    }

    aiPriceTip.onclick = updateAiPrice
    categorySelect.onchange = updateAiPrice
    conditionSelect.onchange = updateAiPrice

    // GPS Button
    document.getElementById('get-gps-btn').onclick = () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          userCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude }
          document.getElementById('location-text').value = `Campus Area (${userCoords.lat.toFixed(4)}, ${userCoords.lng.toFixed(4)})`
        })
      }
    }

    // Submit
    document.getElementById('add-product-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const submitBtn = document.getElementById('submit-btn')
      const errorMsg = document.getElementById('error-msg')
      submitBtn.disabled = true
      submitBtn.textContent = 'Posting Item...'
      errorMsg.classList.add('hidden')

      const mode = document.querySelector('input[name="marketplace_mode"]:checked').value
      const title = document.getElementById('title').value.trim()
      const price = parseFloat(document.getElementById('price').value)
      const category = categorySelect.value
      const condition = conditionSelect.value
      const meetingPoint = document.getElementById('meeting-point').value
      const locationText = document.getElementById('location-text').value.trim() || meetingPoint
      const description = document.getElementById('description').value.trim()

      const photoUrls = []
      // Upload photos to storage or use demo campus images
      for (const file of photoFiles) {
        try {
          const fileName = `${currentUser.id}/${Date.now()}-${file.name}`
          await supabase.storage.from('product-images').upload(fileName, file)
          const { data: { publicUrl } } = supabase.storage.from('product-images').getPublicUrl(fileName)
          photoUrls.push(publicUrl)
        } catch (e) {
          photoUrls.push(URL.createObjectURL(file))
        }
      }

      if (photoUrls.length === 0) {
        photoUrls.push('https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=600&auto=format&fit=crop')
      }

      const productRecord = {
        user_id: currentUser.id,
        seller_id: currentUser.id,
        title: title,
        description: description,
        price: price,
        category: category,
        condition: condition,
        marketplace_mode: mode,
        meeting_point: meetingPoint,
        pickup_location: locationText,
        location: locationText,
        photos: photoUrls,
        image_url: photoUrls[0],
        lat: userCoords?.lat || 11.0168,
        lng: userCoords?.lng || 76.9558,
        status: 'available',
        views_count: 0
      }

      try {
        const { error } = await supabase.from('products').insert(productRecord)
        if (error) {
          console.warn('DB insert fallback:', error.message)
          const localItems = JSON.parse(localStorage.getItem('ccm_fallback_products') || '[]')
          localItems.unshift({ id: 'prod_' + Date.now(), created_at: new Date().toISOString(), ...productRecord })
          localStorage.setItem('ccm_fallback_products', JSON.stringify(localItems))
        }

        submitBtn.textContent = 'Posted Successfully! ✓'
        submitBtn.classList.add('bg-green-600')
        setTimeout(() => {
          window.location.href = '../index.html'
        }, 1000)
      } catch (err) {
        errorMsg.textContent = err.message || 'Failed to list item'
        errorMsg.classList.remove('hidden')
        submitBtn.disabled = false
        submitBtn.textContent = '🚀 Post Listing to Marketplace'
      }
    })
  </script>
</body>
</html>
