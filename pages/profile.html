<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - CCM 2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>
  <!-- Theme Animations CSS -->
<link rel="stylesheet" href="../css/theme-animations.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-200">
  <nav class="bmw-navbar bg-white dark:bg-gray-800 shadow-md p-4 sticky top-0 z-10 transition-colors animate-fade-down">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="../index.html" class="text-2xl font-bold text-blue-600 dark:text-blue-400 bmw-hover px-3 py-1 rounded-lg">CCM 2.0</a>
      <div class="flex gap-4 items-center">
        <a href="chats.html" class="text-gray-600 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 bmw-hover">Chats</a>
        <a href="post-product.html" class="transformer-btn bmw-hover bg-blue-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-700">+ Sell</a>
        <button id="logout-btn" class="text-red-500 hover:text-red-600 font-bold bmw-hover">Logout</button>
      </div>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto p-4 page-transition">
    <!-- Profile Info + Stats -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow mb-6 hover-lift animate-scale-in transition-colors">
      <div class="p-6">
        <div class="flex items-start gap-4 mb-4">
          <div class="relative">
            <img id="avatar" src="https://ui-avatars.com/api/?name=User&background=random"
                 class="w-20 h-20 rounded-full border-4 border-blue-100 dark:border-gray-700 object-cover hover-scale">
            <label for="avatar-upload" class="transformer-btn absolute bottom-0 right-0 bg-blue-600 text-white p-1.5 rounded-full cursor-pointer hover:bg-blue-700 text-xs">
              📷
            </label>
            <input type="file" id="avatar-upload" accept="image/*" class="hidden">
          </div>
          <div class="flex-1">
            <div class="flex items-center gap-3 mb-1">
              <h2 id="name" class="text-2xl font-bold text-gray-900 dark:text-white">Loading...</h2>
              <button id="edit-profile-btn" class="transformer-btn text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 text-sm font-semibold">
                ✏️ Edit
              </button>
            </div>
            <p id="user-type" class="text-gray-500 dark:text-gray-400 capitalize">Loading...</p>
            <p class="text-yellow-500 mt-1">⭐ <span id="rating">5.0</span> Rating</p>
            <p id="bio-text" class="text-gray-600 dark:text-gray-300 text-sm mt-2"></p>
            <p id="location-text" class="text-gray-500 dark:text-gray-400 text-sm mt-1"></p>
          </div>
        </div>

        <!-- Edit Form - Hidden by default -->
        <div id="edit-form" class="hidden border-t dark:border-gray-700 pt-4 mt-4 animate-fade-in">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Name *</label>
              <input type="text" id="name-input" class="w-full p-2 border dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white transition-all">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Phone</label>
              <input type="tel" id="phone-input" placeholder="9876543210" class="w-full p-2 border dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white transition-all">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Location</label>
              <input type="text" id="location-input" placeholder="Coimbatore, Tamil Nadu" class="w-full p-2 border dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white transition-all">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">User Type</label>
              <select id="user-type-input" class="w-full p-2 border dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white transition-all">
                <option value="student">Student</option>
                <option value="local_seller">Local Seller</option>
              </select>
            </div>
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Bio</label>
            <textarea id="bio-input" rows="2" placeholder="Tell us about yourself..."
                      class="w-full p-2 border dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 bg-white dark:bg-gray-700 text-gray-900 dark:text-white transition-all"></textarea>
          </div>
          <div class="flex gap-3">
            <button id="save-profile-btn" class="transformer-btn bmw-hover bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 font-semibold">
              Save Changes
            </button>
            <button id="cancel-edit-btn" class="transformer-btn bmw-hover bg-gray-300 dark:bg-gray-600 text-gray-700 dark:text-gray-200 px-6 py-2 rounded-lg hover:bg-gray-400 dark:hover:bg-gray-500 font-semibold">
              Cancel
            </button>
          </div>
        </div>
      </div>

      <!-- Stats Row -->
      <div class="grid grid-cols-3 gap-4 px-6 pb-6 border-t dark:border-gray-700 pt-6">
        <div class="text-center hover-lift">
          <div class="text-2xl font-bold text-blue-600 dark:text-blue-400" id="listing-count">0</div>
          <div class="text-sm text-gray-500 dark:text-gray-400">Listings</div>
        </div>
        <div class="text-center hover-lift">
          <div class="text-2xl font-bold text-green-600 dark:text-green-400" id="chat-count">0</div>
          <div class="text-sm text-gray-500 dark:text-gray-400">Active Chats</div>
        </div>
        <div class="text-center hover-lift">
          <div class="text-2xl font-bold text-purple-600 dark:text-purple-400" id="active-count">0</div>
          <div class="text-sm text-gray-500 dark:text-gray-400">Active</div>
        </div>
      </div>
    </div>

    <!-- My Listings -->
    <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 hover-lift animate-fade-up transition-colors">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-xl font-bold text-gray-900 dark:text-white">My Listings</h3>
        <a href="add-product.html" class="transformer-btn bmw-hover text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300 font-bold">+ Add New</a>
      </div>

      <div id="my-products" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="col-span-full text-center text-gray-400 dark:text-gray-500 py-10 animate-pulse">Loading listings...</div>
      </div>
    </div>
  </div>

  
  <div id="delete-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white dark:bg-gray-800 rounded-lg p-6 max-w-sm mx-4 animate-scale-in">
      <h3 class="text-lg font-bold mb-4 text-gray-900 dark:text-white">Delete Listing?</h3>
      <p class="text-gray-600 dark:text-gray-300 mb-6">Are you sure da? Itha thirumba eduka mudiyathu.</p>
      <div class="flex gap-3">
        <button id="cancel-delete" class="transformer-btn flex-1 bg-gray-200 dark:bg-gray-600 text-gray-700 dark:text-gray-200 py-2 rounded-lg font-bold">Cancel</button>
        <button id="confirm-delete" class="transformer-btn flex-1 bg-red-500 text-white py-2 rounded-lg font-bold">Delete</button>
      </div>
    </div>
  </div>

  <!-- Global Theme Button - INLINE FIX -->
  <script>
    // Theme Controller - Inline version
    const html = document.documentElement
    const THEME_KEY = 'ccm-theme'
    
    function applyTheme() {
      const saved = localStorage.getItem(THEME_KEY)
      if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        html.classList.add('dark')
      } else {
        html.classList.remove('dark')
      }
    }
    
    function toggleTheme() {
      html.classList.toggle('dark')
      const isDark = html.classList.contains('dark')
      localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light')
      return isDark ? '☀️' : '🌙'
    }
    
    function getThemeIcon() {
      return html.classList.contains('dark') ? '☀️' : '🌙'
    }
    
    // Apply on load
    applyTheme()
    
    // Create floating button
    const btn = document.createElement('button')
    btn.id = 'global-theme-toggle'
    btn.className = 'fixed bottom-6 right-6 z-50 text-2xl p-4 rounded-full bg-white dark:bg-gray-800 shadow-2xl hover:scale-110 active:scale-95 transition-all border-2 border-gray-200 dark:border-gray-700 transformer-btn'
    btn.textContent = getThemeIcon()
    btn.title = 'Toggle Theme'
    btn.onclick = () => {
      btn.textContent = toggleTheme()
    }
    
    document.body.appendChild(btn)
  </script>

  <script type="module">
    import { supabase } from '../js/supabase.js'

    let currentUser = null
    let currentProfile = null
    let deleteProductId = null

    try {
      const { data: { user }, error: authError } = await supabase.auth.getUser()

      if (authError ||!user) {
        window.location.href = 'login.html'
        throw new Error('Not logged in')
      }
      currentUser = user

      await loadProfile()
      await loadMyListings()
      await loadStats()

    } catch (err) {
      console.error('Profile page error:', err)
      document.body.innerHTML = `
        <div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900">
          <div class="text-center animate-fade-in">
            <h2 class="text-2xl font-bold text-red-500 mb-2">Error Loading Profile</h2>
            <p class="text-gray-600 dark:text-gray-300 mb-4">${err.message}</p>
            <a href="../index.html" class="transformer-btn bg-blue-600 text-white px-4 py-2 rounded">Go Home</a>
          </div>
        </div>
      `
    }

    async function loadProfile() {
      const { data: profile, error: profileError } = await supabase
     .from('profiles')
     .select('*')
     .eq('id', currentUser.id)
     .single()

      if (profileError && profileError.code!== 'PGRST116') throw profileError

      currentProfile = profile || {}

      document.getElementById('avatar').src = profile?.avatar_url || `https://ui-avatars.com/api/?name=${encodeURIComponent(profile?.name || currentUser.email)}&background=random`
      document.getElementById('name').textContent = profile?.name || 'No Name'
      document.getElementById('user-type').textContent = profile?.user_type?.replace('_', ' ') || 'student'
      document.getElementById('rating').textContent = profile?.rating || '5.0'
      document.getElementById('bio-text').textContent = profile?.bio || ''
      document.getElementById('location-text').textContent = profile?.location ? `📍 ${profile.location}` : ''

      document.getElementById('name-input').value = profile?.name || ''
      document.getElementById('phone-input').value = profile?.phone || ''
      document.getElementById('location-input').value = profile?.location || ''
      document.getElementById('bio-input').value = profile?.bio || ''
      document.getElementById('user-type-input').value = profile?.user_type || 'student'
    }

    document.getElementById('edit-profile-btn').onclick = () => {
      document.getElementById('edit-form').classList.remove('hidden')
      document.getElementById('edit-profile-btn').classList.add('hidden')
    }

    document.getElementById('cancel-edit-btn').onclick = () => {
      document.getElementById('edit-form').classList.add('hidden')
      document.getElementById('edit-profile-btn').classList.remove('hidden')
      loadProfile()
    }

    document.getElementById('save-profile-btn').onclick = async () => {
      const updates = {
        id: currentUser.id,
        email: currentUser.email,
        name: document.getElementById('name-input').value.trim(),
        phone: document.getElementById('phone-input').value.trim(),
        location: document.getElementById('location-input').value.trim(),
        bio: document.getElementById('bio-input').value.trim(),
        user_type: document.getElementById('user-type-input').value
      }

      if (!updates.name) {
        alert('Must Enter Name')
        return
      }

      const { error } = await supabase.from('profiles').upsert(updates)

      if (error) {
        alert('Save failed: ' + error.message)
      } else {
        alert('Profile updated ✅')
        document.getElementById('edit-form').classList.add('hidden')
        document.getElementById('edit-profile-btn').classList.remove('hidden')
        await loadProfile()
      }
    }

    document.getElementById('avatar-upload').onchange = async (e) => {
      const file = e.target.files[0]
      if (!file) return

      if (file.size > 2 * 1024 * 1024) {
        alert('File size 2MB ku mela iruka koodathu da')
        return
      }

      const fileExt = file.name.split('.').pop()
      const fileName = `${currentUser.id}-${Date.now()}.${fileExt}`

      const { data, error } = await supabase.storage
     .from('avatars')
     .upload(fileName, file, { upsert: true })

      if (error) {
        alert('Upload failed: ' + error.message)
        return
      }

      const { data: { publicUrl } } = supabase.storage
     .from('avatars')
     .getPublicUrl(fileName)

      await supabase.from('profiles').update({ avatar_url: publicUrl }).eq('id', currentUser.id)

      document.getElementById('avatar').src = publicUrl
      alert('Profile pic updated ✅')
    }

    async function loadMyListings() {
      const { data: products, error: prodError } = await supabase
     .from('products')
     .select('*')
     .eq('user_id', currentUser.id)
     .order('created_at', { ascending: false })

      if (prodError) throw prodError

      const myProductsDiv = document.getElementById('my-products')
      if (!products || products.length === 0) {
        myProductsDiv.innerHTML = `
          <div class="col-span-full text-center py-12 animate-fade-in">
            <p class="text-gray-400 dark:text-gray-500 mb-4">No listings yet</p>
            <a href="post-product.html" class="transformer-btn bmw-hover bg-blue-600 text-white px-6 py-2 rounded-lg inline-block font-bold">Post Your First Product</a>
          </div>
        `
        return
      }

      myProductsDiv.innerHTML = products.map((p, i) => `
        <div class="border dark:border-gray-700 rounded-lg overflow-hidden hover-lift animate-scale-in transition bg-white dark:bg-gray-800" style="animation-delay: ${i * 0.1}s">
          <img src="${p.photos?.[0] || 'https://via.placeholder.com/300x200?text=No+Image'}"
               class="w-full h-48 object-cover hover-scale" alt="${p.title}">
          <div class="p-4">
            <h4 class="font-bold truncate text-gray-900 dark:text-white">${p.title}</h4>
            <p class="text-blue-600 dark:text-blue-400 font-bold text-lg">₹${p.price?.toLocaleString('en-IN')}</p>
            <div class="flex gap-2 mt-2 mb-3">
              <span class="text-xs px-2 py-1 rounded ${p.status === 'active'? 'bg-green-100 dark:bg-green-900 text-green-700 dark:text-green-300' : 'bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300'}">${p.status || 'active'}</span>
              <span class="text-xs px-2 py-1 rounded bg-blue-100 dark:bg-blue-900 text-blue-700 dark:text-blue-300">${p.condition || 'used'}</span>
            </div>
            <div class="flex gap-2">
              <button onclick="editProduct('${p.id}')"
                      class="transformer-btn flex-1 bg-blue-50 dark:bg-blue-900/50 text-blue-600 dark:text-blue-400 py-2 rounded text-sm font-bold hover:bg-blue-100 dark:hover:bg-blue-900">
                Edit
              </button>
              <button onclick="confirmDeleteProduct('${p.id}')"
                      class="transformer-btn flex-1 bg-red-50 dark:bg-red-900/50 text-red-600 dark:text-red-400 py-2 rounded text-sm font-bold hover:bg-red-100 dark:hover:bg-red-900">
                Delete
              </button>
            </div>
          </div>
        </div>
      `).join('')
    }

    async function loadStats() {
      const { count: listingCount } = await supabase
     .from('products')
     .select('*', { count: 'exact', head: true })
     .eq('user_id', currentUser.id)

      const { count: activeCount } = await supabase
     .from('products')
     .select('*', { count: 'exact', head: true })
     .eq('user_id', currentUser.id)
     .eq('status', 'active')

      const { count: chatCount } = await supabase
     .from('conversations')
     .select('*', { count: 'exact', head: true })
     .or(`buyer_id.eq.${currentUser.id},seller_id.eq.${currentUser.id}`)

      document.getElementById('listing-count').textContent = listingCount || 0
      document.getElementById('active-count').textContent = activeCount || 0
      document.getElementById('chat-count').textContent = chatCount || 0
    }

    window.editProduct = (id) => {
      window.location.href = `edit-product.html?id=${id}`
    }

    window.confirmDeleteProduct = (id) => {
      deleteProductId = id
      document.getElementById('delete-modal').classList.remove('hidden')
    }

    document.getElementById('cancel-delete').addEventListener('click', () => {
      document.getElementById('delete-modal').classList.add('hidden')
      deleteProductId = null
    })

    document.getElementById('confirm-delete').addEventListener('click', async () => {
      if (!deleteProductId) return

      const { error } = await supabase
     .from('products')
     .delete()
     .eq('id', deleteProductId)

      if (error) {
        alert('Delete failed: ' + error.message)
      } else {
        document.getElementById('delete-modal').classList.add('hidden')
        await loadMyListings()
        await loadStats()
      }
      deleteProductId = null
    })

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabase.auth.signOut()
      window.location.href = '../index.html'
    })
  </script>
  <!-- Theme Effects JS -->
<script type="module" src="../js/theme-effects.js"></script>
</body>
</html>
