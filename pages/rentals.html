<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rent & Borrow - CCM 2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
  <nav id="main-navbar"></nav>

  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
      <div>
        <h1 class="text-2xl sm:text-3xl font-black flex items-center gap-2">
          <span>📚</span> Rent & Borrow Hub
        </h1>
        <p class="text-xs text-gray-400 mt-1">
          Borrow textbooks, lab equipment, bicycles, and calculators for exams and mini-projects
        </p>
      </div>

      <!-- Tab Switcher -->
      <div class="flex items-center bg-gray-200 dark:bg-gray-800 p-1 rounded-xl text-xs font-bold">
        <button id="tab-rent-browse" class="px-4 py-2 rounded-lg bg-blue-600 text-white shadow transition">
          Browse Rentals
        </button>
        <button id="tab-my-rentals" class="px-4 py-2 rounded-lg text-gray-600 dark:text-gray-300 hover:text-blue-600 transition">
          My Active Rentals
        </button>
      </div>
    </div>

    <!-- Section 1: Browse Rentals -->
    <div id="section-rent-browse" class="space-y-6">
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5" id="rental-grid">
        <div class="col-span-full text-center py-12 text-xs text-gray-400">Loading rental inventory...</div>
      </div>
    </div>

    <!-- Section 2: My Active Rentals -->
    <div id="section-my-rentals" class="hidden space-y-4">
      <h3 class="font-bold text-sm">Active Borrowing & Return Tracking</h3>
      <div id="my-rentals-list" class="space-y-3">
        <div class="text-center py-12 text-xs text-gray-400">Loading your rentals...</div>
      </div>
    </div>

  </div>

  <!-- Rental Booking Modal -->
  <div id="rental-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 p-6 rounded-2xl max-w-sm w-full shadow-2xl space-y-4">
      <h3 class="text-base font-black">📅 Book Rental Duration</h3>
      <div class="p-3 bg-gray-50 dark:bg-gray-700 rounded-xl text-xs">
        <div class="font-bold" id="rent-modal-title">Item</div>
        <div class="text-blue-600 font-bold mt-0.5" id="rent-modal-rate">₹50 / day</div>
      </div>

      <div>
        <label class="block text-xs font-bold mb-1">Start Date *</label>
        <input type="date" id="rent-start-date" class="w-full px-3 py-2 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-xs">
      </div>

      <div>
        <label class="block text-xs font-bold mb-1">Return Date *</label>
        <input type="date" id="rent-end-date" class="w-full px-3 py-2 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-xs">
      </div>

      <div class="p-2.5 bg-blue-50 dark:bg-blue-950/40 text-blue-700 dark:text-blue-300 text-xs font-bold rounded-xl flex justify-between">
        <span>Estimated Total:</span>
        <span id="rent-total-cost">₹100</span>
      </div>

      <div class="flex gap-2 pt-2">
        <button id="close-rental-btn" class="flex-1 py-2.5 bg-gray-100 dark:bg-gray-700 text-xs font-bold rounded-xl hover:bg-gray-200">
          Cancel
        </button>
        <button id="confirm-rental-btn" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-xl shadow">
          Confirm Rental
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="../js/theme.js"></script>
  <script type="module" src="../js/i18n.js"></script>
  <script type="module" src="../js/mode.js"></script>
  <script type="module" src="../js/navbar.js"></script>
  <script type="module">
    import { supabase, getCurrentUser } from '../js/supabase.js'

    let currentUser = null
    let selectedRental = null
    let rentalInventory = []

    async function initRentals() {
      currentUser = await getCurrentUser()
      await loadRentalProducts()
    }

    async function loadRentalProducts() {
      const grid = document.getElementById('rental-grid')
      grid.innerHTML = '<div class="col-span-full text-center py-12 text-xs text-gray-400 animate-pulse">Loading rental inventory...</div>'

      let items = []
      try {
        const { data, error } = await supabase
          .from('products')
          .select('*, profiles(name, full_name, college_name)')
          .in('status', ['available', 'active'])
          .order('created_at', { ascending: false })

        if (!error && data) items = data
      } catch (e) {
        console.warn('Rentals fetch note:', e)
      }

      // Merge local listings
      try {
        const local = JSON.parse(localStorage.getItem('ccm_fallback_products') || '[]')
        local.forEach(l => {
          if (['available', 'active'].includes(l.status) && !items.some(it => it.id === l.id)) {
            items.push(l)
          }
        })
      } catch (e) {}

      rentalInventory = items

      if (rentalInventory.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-16 px-4 bg-white dark:bg-gray-800 rounded-2xl border border-dashed border-gray-200 dark:border-gray-700">
            <span class="text-4xl block mb-2">📚</span>
            <h4 class="text-sm font-bold text-gray-700 dark:text-gray-300">No Rental Items Listed Yet</h4>
            <p class="text-xs text-gray-400 mt-1 max-w-sm mx-auto">
              Students and campus members can list cycles, calculators, lab kits, or reference books for daily or weekly borrowing!
            </p>
            <a href="add-product.html" class="inline-block mt-4 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl shadow transition">
              + Post Item for Rent / Borrow
            </a>
          </div>
        `
        return
      }

      grid.innerHTML = rentalInventory.map(item => {
        const photo = item.photos?.[0] || item.image_url || 'https://via.placeholder.com/400x260?text=Rental+Item'
        const dailyRate = Math.max(15, Math.round(item.price * 0.05))
        const pickupSpot = item.meeting_point || item.pickup_location || 'Campus Main Gate'
        const isOwner = currentUser && (currentUser.id === item.user_id || currentUser.id === item.seller_id)

        return `
          <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-200 dark:border-gray-700 p-4 shadow-sm hover-lift flex flex-col justify-between">
            <div>
              <img src="${photo}" class="w-full h-48 sm:h-52 md:h-56 object-cover object-center rounded-xl mb-3" onerror="this.src='https://via.placeholder.com/400x300?text=Campus+Rental'">
              <h4 class="font-bold text-sm text-gray-900 dark:text-white truncate">${item.title}</h4>
              <div class="text-blue-600 font-black text-base mt-1">₹${dailyRate} <span class="text-xs text-gray-400 font-normal">/ day</span></div>
              <p class="text-[11px] text-gray-400 mt-1">📍 Handover Spot: <b>${pickupSpot}</b></p>
            </div>
            ${isOwner ? `
              <div class="w-full mt-4 bg-gray-100 dark:bg-gray-700 text-gray-600 dark:text-gray-300 font-bold py-2.5 rounded-xl text-xs text-center">
                Your Listing
              </div>
            ` : `
              <button onclick="openRentalModal('${item.id}', '${item.title.replace(/'/g, "\\'")}', ${dailyRate}, '${item.seller_id || item.user_id || ''}')" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl text-xs shadow transition">
                Book / Borrow Now →
              </button>
            `}
          </div>
        `
      }).join('')
    }

    window.openRentalModal = (id, title, rate, ownerId) => {
      if (!currentUser) {
        alert('Please login to borrow items')
        window.location.href = 'login.html'
        return
      }
      selectedRental = { id, title, rate, ownerId }
      document.getElementById('rent-modal-title').textContent = title
      document.getElementById('rent-modal-rate').textContent = `₹${rate} / day`

      const today = new Date().toISOString().split('T')[0]
      const tomorrow = new Date(Date.now() + 86400000 * 3).toISOString().split('T')[0]
      document.getElementById('rent-start-date').value = today
      document.getElementById('rent-end-date').value = tomorrow
      calculateRentalCost()
      document.getElementById('rental-modal').classList.remove('hidden')
    }

    function calculateRentalCost() {
      const start = new Date(document.getElementById('rent-start-date').value)
      const end = new Date(document.getElementById('rent-end-date').value)
      const diffTime = Math.max(86400000, end - start)
      const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24))
      const total = diffDays * (selectedRental?.rate || 30)
      document.getElementById('rent-total-cost').textContent = `₹${total} (${diffDays} days)`
      return { days: diffDays, total }
    }

    document.getElementById('rent-start-date').onchange = calculateRentalCost
    document.getElementById('rent-end-date').onchange = calculateRentalCost

    document.getElementById('close-rental-btn').onclick = () => {
      document.getElementById('rental-modal').classList.add('hidden')
    }

    document.getElementById('confirm-rental-btn').onclick = async () => {
      const { days, total } = calculateRentalCost()
      const startDate = document.getElementById('rent-start-date').value
      const returnDate = document.getElementById('rent-end-date').value

      // Try Supabase rentals insert
      try {
        await supabase.from('rentals').insert({
          product_id: selectedRental.id,
          renter_id: currentUser.id,
          rental_price: total,
          duration_days: days,
          start_date: startDate,
          return_date: returnDate,
          status: 'active'
        })
      } catch (e) {
        console.warn('Rentals table insert note:', e)
      }

      // Local fallback
      const record = {
        id: 'rent_' + Date.now(),
        title: selectedRental.title,
        days: days,
        total: total,
        start: startDate,
        end: returnDate,
        status: 'Active (Return Pending)',
        created_at: new Date().toISOString()
      }

      const list = JSON.parse(localStorage.getItem('ccm_active_rentals') || '[]')
      list.unshift(record)
      localStorage.setItem('ccm_active_rentals', JSON.stringify(list))

      alert(`✅ Rental Booking Placed!\nItem: ${selectedRental.title}\nReturn Date: ${record.end}\nEstimated Total: ₹${total}`)
      document.getElementById('rental-modal').classList.add('hidden')
      loadMyRentals()
      document.getElementById('tab-my-rentals').click()
    }

    window.returnRentalItem = async (rentalId) => {
      if (!confirm('Are you sure you want to return this borrowed item to the campus owner?')) return

      try {
        await supabase
          .from('rentals')
          .update({ status: 'returned' })
          .eq('id', rentalId)
      } catch (e) {
        console.warn('Supabase rental return update note:', e)
      }

      // Update in localStorage
      const localList = JSON.parse(localStorage.getItem('ccm_active_rentals') || '[]')
      const updated = localList.map(item => {
        if (item.id === rentalId) {
          return { ...item, status: 'RETURNED' }
        }
        return item
      })
      localStorage.setItem('ccm_active_rentals', JSON.stringify(updated))

      alert('✅ Item marked as Returned successfully! Thank you for using Campus Rentals.')
      loadMyRentals()
    }

    async function loadMyRentals() {
      const container = document.getElementById('my-rentals-list')
      container.innerHTML = '<div class="text-center py-12 text-xs text-gray-400 animate-pulse">Loading your rentals...</div>'

      let rentals = []
      if (currentUser) {
        try {
          const { data } = await supabase
            .from('rentals')
            .select('*, products(title)')
            .eq('renter_id', currentUser.id)
            .order('created_at', { ascending: false })
          if (data && data.length > 0) {
            rentals = data.map(r => ({
              id: r.id,
              title: r.products?.title || 'Campus Item',
              start: r.start_date,
              end: r.return_date,
              days: r.duration_days,
              total: r.rental_price,
              status: (r.status || 'Active').toUpperCase()
            }))
          }
        } catch (e) {}
      }

      const localList = JSON.parse(localStorage.getItem('ccm_active_rentals') || '[]')
      localList.forEach(l => {
        if (!rentals.some(r => r.id === l.id)) rentals.push(l)
      })

      if (rentals.length === 0) {
        container.innerHTML = '<div class="text-center py-12 text-xs text-gray-400">No active rentals. Borrow a cycle, book, or lab gear above!</div>'
        return
      }

      container.innerHTML = rentals.map(r => {
        const isReturned = (r.status || '').toLowerCase() === 'returned'
        return `
        <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
          <div>
            <h4 class="font-bold text-sm text-gray-900 dark:text-white">${r.title}</h4>
            <p class="text-[11px] text-gray-400 mt-1">Duration: ${r.start} to ${r.end} (${r.days || 1} days) • Fee: ₹${r.total}</p>
          </div>
          <div class="flex items-center gap-2">
            <span class="px-3 py-1 font-bold text-[10px] rounded-full ${isReturned ? 'bg-green-100 text-green-700 dark:bg-green-900/30 dark:text-green-400' : 'bg-blue-100 text-blue-700 dark:bg-blue-900/30 dark:text-blue-400'}">
              ${isReturned ? '✅ RETURNED' : '⏳ ' + r.status}
            </span>
            ${!isReturned ? `
              <button onclick="returnRentalItem('${r.id}')" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold shadow transition flex items-center gap-1">
                🔄 Return Item
              </button>
            ` : ''}
          </div>
        </div>
      `}).join('')
    }

    document.getElementById('tab-rent-browse').onclick = () => {
      document.getElementById('section-rent-browse').classList.remove('hidden')
      document.getElementById('section-my-rentals').classList.add('hidden')
      document.getElementById('tab-rent-browse').className = 'px-4 py-2 rounded-lg bg-blue-600 text-white shadow transition'
      document.getElementById('tab-my-rentals').className = 'px-4 py-2 rounded-lg text-gray-600 dark:text-gray-300 hover:text-blue-600 transition'
    }
    document.getElementById('tab-my-rentals').onclick = () => {
      document.getElementById('section-my-rentals').classList.remove('hidden')
      document.getElementById('section-rent-browse').classList.add('hidden')
      document.getElementById('tab-my-rentals').className = 'px-4 py-2 rounded-lg bg-blue-600 text-white shadow transition'
      document.getElementById('tab-rent-browse').className = 'px-4 py-2 rounded-lg text-gray-600 dark:text-gray-300 hover:text-blue-600 transition'
      loadMyRentals()
    }

    initRentals()
  </script>
</body>
</html>
