<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Campus Community Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 flex flex-col justify-between min-h-screen">
  <nav id="main-navbar"></nav>

  <div class="max-w-md w-full mx-auto px-4 py-12">
    <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-md border border-gray-200 dark:border-gray-700">
      
      <div class="text-center mb-6">
        <span class="text-4xl block mb-2">🎓</span>
        <h2 class="text-2xl font-black text-blue-600 dark:text-blue-400">Welcome Back</h2>
        <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Sign in to College or Community Marketplace</p>
      </div>

      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-bold mb-1">Email Address</label>
          <input type="email" id="email" required placeholder="name@college.edu or gmail"
                 class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-bold">Password</label>
            <a href="forgot-password.html" class="text-xs text-blue-600 dark:text-blue-400 hover:underline">Forgot password?</a>
          </div>
          <input type="password" id="password" required placeholder="••••••••"
                 class="w-full px-3 py-2.5 rounded-xl border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-700 text-sm focus:ring-2 focus:ring-blue-500">
        </div>

        <div class="flex items-center text-xs text-gray-600 dark:text-gray-300">
          <input type="checkbox" id="remember" class="mr-2 rounded text-blue-600 focus:ring-blue-500">
          <label for="remember">Remember this device</label>
        </div>

        <div id="error-msg" class="text-xs text-red-500 font-semibold text-center hidden"></div>

        <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition shadow-md">
          Sign In
        </button>

        <div class="relative flex py-1 items-center">
          <div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
          <span class="flex-shrink mx-3 text-[11px] text-gray-400">or test quickly</span>
          <div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
        </div>

        <button type="button" id="demo-student-btn" class="w-full bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 border border-blue-200 dark:border-blue-800 hover:bg-blue-100 font-bold py-2.5 rounded-xl transition text-xs flex items-center justify-center gap-2">
          <span>🎓</span> One-Click Demo Login (Student)
        </button>
      </form>

      <div class="mt-6 text-center text-xs text-gray-500 dark:text-gray-400 border-t border-gray-100 dark:border-gray-700 pt-4">
        Don't have an account? 
        <a href="register.html" class="text-blue-600 dark:text-blue-400 font-bold hover:underline">Create an account</a>
      </div>

    </div>
  </div>

  <div class="py-4"></div>

  <script type="module" src="../js/theme.js"></script>
  <script type="module" src="../js/i18n.js"></script>
  <script type="module" src="../js/mode.js"></script>
  <script type="module" src="../js/navbar.js"></script>
  <script type="module">
    import { supabase } from '../js/supabase.js'

    const form = document.getElementById('login-form')
    const errorMsg = document.getElementById('error-msg')
    const loginBtn = document.getElementById('login-btn')

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      errorMsg.classList.add('hidden')
      loginBtn.disabled = true
      loginBtn.textContent = 'Signing in...'

      const email = document.getElementById('email').value.trim()
      const password = document.getElementById('password').value

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password })
        if (error) throw error

        loginBtn.textContent = 'Success! Redirecting...'
        loginBtn.classList.add('bg-green-600')

        const urlParams = new URLSearchParams(window.location.search)
        const redirect = urlParams.get('redirect') || '../index.html'

        setTimeout(() => {
          window.location.href = redirect
        }, 800)
      } catch (err) {
        errorMsg.textContent = err.message || 'Login failed. Please check your email and password.'
        errorMsg.classList.remove('hidden')
        loginBtn.disabled = false
        loginBtn.textContent = 'Sign In'
      }
    })

    document.getElementById('demo-student-btn')?.addEventListener('click', () => {
      const demoUser = {
        id: 'e744d937-963e-49fe-ab87-b28e5b66d263',
        email: 'akash.student@college.edu',
        user_metadata: { full_name: 'Akash Student', role: 'student' }
      }
      localStorage.setItem('ccm_demo_user', JSON.stringify(demoUser))
      const urlParams = new URLSearchParams(window.location.search)
      const redirect = urlParams.get('redirect') || '../index.html'
      window.location.href = redirect
    })
  </script>
</body>
</html>
