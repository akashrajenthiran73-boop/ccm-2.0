<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - CCM 2.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen">
  <nav id="main-navbar"></nav>

  <div class="max-w-4xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-black flex items-center gap-2">
        <span>🛒</span> Shopping Cart
      </h1>
      <button id="clear-cart-btn" class="text-xs text-red-500 hover:underline font-bold">
        Clear All Items
      </button>
    </div>

    <div class="grid md:grid-cols-12 gap-6">
      
      <!-- Cart Items List -->
      <div class="md:col-span-8 space-y-3" id="cart-items-container">
        <div class="text-center py-12 text-xs text-gray-400">Loading cart items...</div>
      </div>

      <!-- Order Summary Card -->
      <div class="md:col-span-4">
        <div class="bg-white dark:bg-gray-800 p-5 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm space-y-4">
          <h3 class="font-bold text-sm">Order Summary</h3>

          <div class="space-y-2 text-xs">
            <div class="flex justify-between text-gray-500">
              <span>Items Total</span>
              <span class="font-bold text-gray-800 dark:text-gray-200" id="cart-subtotal">₹0</span>
            </div>
            <div class="flex justify-between text-gray-500">
              <span>Campus Meeting Handover</span>
              <span class="font-bold text-emerald-600">FREE</span>
            </div>
            <div class="border-t border-gray-100 dark:border-gray-700 pt-2 flex justify-between text-sm font-black">
              <span>Total Payable</span>
              <span class="text-blue-600 dark:text-blue-400" id="cart-total">₹0</span>
            </div>
          </div>

          <button id="checkout-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl text-xs transition shadow flex items-center justify-center gap-2">
            <span>Proceed to Checkout</span> →
          </button>

          <p class="text-[10px] text-gray-400 text-center">
            🔒 Safe simulation checkout. No real money required.
          </p>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="../js/theme.js"></script>
  <script type="module" src="../js/i18n.js"></script>
  <script type="module" src="../js/mode.js"></script>
  <script type="module" src="../js/navbar.js"></script>
  <script type="module">
    import { getCart, removeFromCart, updateCartQuantity, clearCart } from '../js/cart.js'

    const container = document.getElementById('cart-items-container')
    const subtotalEl = document.getElementById('cart-subtotal')
    const totalEl = document.getElementById('cart-total')

    async function renderCartView() {
      const items = await getCart()

      if (!items || items.length === 0) {
        container.innerHTML = `
          <div class="bg-white dark:bg-gray-800 rounded-2xl p-10 text-center border border-gray-200 dark:border-gray-700">
            <span class="text-4xl block mb-2">🛍️</span>
            <p class="font-bold text-sm">Your cart is currently empty</p>
            <p class="text-xs text-gray-400 mt-1 mb-4">Browse books, cycles, and study gear to add.</p>
            <a href="../index.html" class="inline-block px-5 py-2.5 bg-blue-600 text-white text-xs font-bold rounded-xl shadow">Explore Marketplace</a>
          </div>
        `
        subtotalEl.textContent = '₹0'
        totalEl.textContent = '₹0'
        document.getElementById('checkout-btn').disabled = true
        return
      }

      document.getElementById('checkout-btn').disabled = false

      let total = 0
      container.innerHTML = items.map(item => {
        const p = item.product || { title: 'Campus Item', price: 0 }
        const itemTotal = (p.price || 0) * (item.quantity || 1)
        total += itemTotal

        return `
          <div class="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-gray-200 dark:border-gray-700 shadow-sm flex items-center justify-between gap-4">
            <img src="${p.photos?.[0] || p.image_url || 'https://via.placeholder.com/100'}" class="w-16 h-16 object-cover rounded-xl border border-gray-100 dark:border-gray-700">
            
            <div class="flex-1 min-w-0">
              <h4 class="font-bold text-xs truncate text-gray-900 dark:text-white">${p.title}</h4>
              <p class="text-[11px] text-gray-400 mt-0.5">₹${p.price} each</p>
              <div class="text-blue-600 font-bold text-sm mt-1">₹${itemTotal}</div>
            </div>

            <div class="flex items-center gap-2">
              <button onclick="changeQty('${item.product_id}', ${(item.quantity || 1) - 1})" class="w-7 h-7 bg-gray-100 dark:bg-gray-700 rounded-lg font-bold text-xs hover:bg-gray-200">-</button>
              <span class="text-xs font-bold px-1">${item.quantity || 1}</span>
              <button onclick="changeQty('${item.product_id}', ${(item.quantity || 1) + 1})" class="w-7 h-7 bg-gray-100 dark:bg-gray-700 rounded-lg font-bold text-xs hover:bg-gray-200">+</button>
            </div>

            <button onclick="deleteItem('${item.product_id}')" class="text-gray-400 hover:text-red-500 p-2 text-xs" title="Remove">
              ✕
            </button>
          </div>
        `
      }).join('')

      subtotalEl.textContent = `₹${total}`
      totalEl.textContent = `₹${total}`
    }

    window.changeQty = async (productId, qty) => {
      await updateCartQuantity(productId, qty)
      renderCartView()
    }

    window.deleteItem = async (productId) => {
      await removeFromCart(productId)
      renderCartView()
    }

    document.getElementById('clear-cart-btn').onclick = async () => {
      if (confirm('Clear all items from your shopping cart?')) {
        await clearCart()
        renderCartView()
      }
    }

    document.getElementById('checkout-btn').onclick = () => {
      window.location.href = 'checkout.html'
    }

    renderCartView()
  </script>
</body>
</html>
